services:
  - type: web
    name: taxcasereview-signalwire
    runtime: node
    plan: free
    rootDir: signalwire-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SIGNALWIRE_SPACE
        sync: false
      - key: SIGNALWIRE_PROJECT
        sync: false
      - key: SIGNALWIRE_TOKEN
        sync: false
      - key: SIGNALWIRE_PHONE
        sync: false
      - key: PORT
        value: 3001
