name: Nashville Supabase Secrets
on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Nashville secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          PROJECT_REF="ydrvncdedgjtcprczwpu"

          # Copy GROQ key (already in GitHub secrets)
          if [ -n "$GROQ_API_KEY" ]; then
            echo "$GROQ_API_KEY" | supabase secrets set GROQ_API_KEY --project-ref "$PROJECT_REF"
          else
            echo "GROQ_API_KEY not in GitHub secrets - need to add manually"
          fi

          echo "Done. Nashville secrets set."
