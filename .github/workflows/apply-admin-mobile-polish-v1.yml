name: Apply Admin Mobile Polish V1
# rerun corrected live-source marker

on:
  push:
    paths:
      - '.github/workflows/apply-admin-mobile-polish-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply polish
        run: python3 .github/scripts/polish_admin_mobile_v1.py
      - name: Verify source
        run: |
          grep -q 'MOBILE_POLISH_V1_20260830' src/pages/AdminPortal.jsx
          grep -q 'VAULT_MOBILE_POLISH_V1_20260830' src/components/admin/CredentialVault.jsx
          grep -q 'rl-vault-actions' src/components/admin/CredentialVault.jsx
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'RomyLabs Bot'
          git config user.email 'actions@github.com'
          git add src/pages/AdminPortal.jsx src/components/admin/CredentialVault.jsx
          git commit -m 'polish(admin): refine mobile command center UI'
          git push
