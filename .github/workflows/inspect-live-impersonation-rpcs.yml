name: Inspect Live Impersonation RPCs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-live-impersonation-rpcs.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
      - name: Fetch create RPC definition
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/q.json
          import json
          print(json.dumps({'query':"select pg_get_functiondef(p.oid) as def from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='create_impersonation_token'"}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/q.json
      - name: Fetch validate RPC definition
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/q.json
          import json
          print(json.dumps({'query':"select pg_get_functiondef(p.oid) as def from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='validate_impersonation_token'"}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/q.json
