name: Fix CRM Metrics Proxy

on:
  push:
    paths:
      - '.github/workflows/fix-crm-metrics-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Route Command Center CRM metrics through hub-proxy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminPortal.jsx')
          s=p.read_text()
          old="""  const fetchCrmMetricsUrl = React.useCallback(async (url) => {
    if (!url) return null
    const { data: sessionData } = await supabase.auth.getSession()
    const token = sessionData?.session?.access_token
    if (!token) throw new Error('Admin session unavailable')
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } })
    const body = await res.json().catch(() => ({}))
    if (!res.ok || body?.ok === false) throw new Error(body?.error || `Metrics request failed (${res.status})`)
    return body
  }, [])"""
          new="""  const fetchCrmProductMetrics = React.useCallback(async (productKey) => {
    if (!productKey) return null
    const { data: sessionData } = await supabase.auth.getSession()
    const token = sessionData?.session?.access_token
    if (!token) throw new Error('Admin session unavailable')
    const res = await fetch('https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/hub-proxy', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ product: productKey }),
    })
    const body = await res.json().catch(() => ({}))
    if (!res.ok || body?.ok === false) throw new Error(body?.error || `Metrics request failed (${res.status})`)
    return body
  }, [])"""
          if old not in s: raise SystemExit('fetchCrmMetricsUrl anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('fetchCrmMetricsUrl(product.metricsUrl)', 'fetchCrmProductMetrics(crmProduct)', 1)
          s=s.replace('}, [crmProduct, fetchCrmMetricsUrl])', '}, [crmProduct, fetchCrmProductMetrics])', 1)
          # TaxRes registry-only tenant metrics should also use the secure proxy by product key.
          s=s.replace('fetchCrmMetricsUrl(tenantProduct.metricsUrl)', 'fetchCrmProductMetrics(key)', 1)
          s=s.replace('}, [crmProduct, crmAccount, fetchCrmMetricsUrl])', '}, [crmProduct, crmAccount, fetchCrmProductMetrics])', 1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'RomyLabs'
          git config user.email 'info@romylabs.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): use hub proxy for CRM product metrics'
          git push origin HEAD:main
