name: Fix Admin CRM Tab Crash
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-crm-tab.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed CRM KPI JSX
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = 'src/pages/AdminPortal.jsx'
          let s = fs.readFileSync(p,'utf8')
          const openFrom = "            {activeTenant ? ["
          const openTo   = "            {(activeTenant ? ["
          const closeFrom = "            ]}.map(k => <KPICard key={k.label} {...k} />)}"
          const closeTo   = "            ]).map(k => <KPICard key={k.label} {...k} />)}"
          const opens = s.split(openFrom).length - 1
          const closes = s.split(closeFrom).length - 1
          if (opens !== 1 || closes !== 1) throw new Error(`Expected one malformed CRM KPI expression; opens=${opens}, closes=${closes}`)
          s = s.replace(openFrom, openTo).replace(closeFrom, closeTo)
          fs.writeFileSync(p,s)
          NODE
      - run: npm ci
      - name: Production build with JSX warnings treated as failure
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          if grep -q 'AdminPortal.jsx:.*not valid inside a JSX element' /tmp/build.log; then
            echo 'AdminPortal JSX parser warning still present'
            exit 1
          fi
      - name: Verify exact CRM expression
        run: |
          grep -Fq "{(activeTenant ? [" src/pages/AdminPortal.jsx
          grep -Fq "]).map(k => <KPICard key={k.label} {...k} />)}" src/pages/AdminPortal.jsx
          ! grep -Fq "]}.map(k => <KPICard key={k.label} {...k} />)}" src/pages/AdminPortal.jsx
      - name: Commit repair
        run: |
          git config user.name 'RomyLabs Repair Bot'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): repair CRM tab KPI render crash'
          git push origin HEAD:main
