name: Check RomyLabs GA4 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-romylabs-ga4-once.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call live RomyLabs GA4 sync
        shell: bash
        run: |
          set +e
          KEY=$(node - <<'NODE'
          const fs = require('fs')
          const s = fs.readFileSync('src/lib/supabase.js','utf8')
          const m = s.match(/SUPABASE_ANON_KEY[^\n]*\|\|\s*'([^']+)'/)
          if (!m) process.exit(1)
          process.stdout.write(m[1])
          NODE
          )
          RESP=$(curl -sS --max-time 60 \
            -H "Authorization: Bearer ${KEY}" \
            -H "apikey: ${KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"product_id":"romylabs"}' \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/ga4-sync')
          node - "$RESP" <<'NODE'
          const fs = require('fs')
          let out = { checked_at: new Date().toISOString(), product_id: 'romylabs', ok: false }
          try {
            const r = JSON.parse(process.argv[2] || '{}')
            out.ok = r.ok === true
            out.product_id = r.product_id || 'romylabs'
            if (typeof r.rows_upserted === 'number') out.rows_upserted = r.rows_upserted
            if (r.error) out.error = String(r.error).slice(0, 1000)
          } catch (e) {
            out.error = 'Non-JSON response from ga4-sync'
          }
          fs.writeFileSync('romylabs-ga4-check.json', JSON.stringify(out, null, 2) + '\n')
          NODE
      - name: Save sanitized result
        shell: bash
        run: |
          git config user.name 'RomyLabs QA'
          git config user.email 'qa@romylabs.com'
          git add romylabs-ga4-check.json
          git commit -m 'test(analytics): record RomyLabs GA4 verification result' || true
          git push || true
