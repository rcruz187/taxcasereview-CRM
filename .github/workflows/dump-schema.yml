name: Dump Schema
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project to dump: tcr or nashville'
        required: true
        default: 'tcr'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        run: |
          npm install -g supabase --legacy-peer-deps 2>/dev/null
          supabase --version

      - name: Dump schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.target }}" = "nashville" ]; then
            PROJECT_REF="alozyneyvvtjekiyqdyb"
          else
            PROJECT_REF="mpxgxfqdbquzkrvvejkh"
          fi
          supabase db dump \
            --project-ref "$PROJECT_REF" \
            --schema-only \
            -f schema.sql 2>&1
          echo "=== LINES ==="
          wc -l schema.sql || echo "schema.sql not created"

      - name: Upload schema artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-${{ inputs.target }}-${{ github.run_id }}
          path: schema.sql
          retention-days: 1
          if-no-files-found: warn
