name: Dump Schema
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project to dump: tcr or nashville'
        required: true
        default: 'tcr'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/download/v2.0.4/supabase_linux_amd64.tar.gz | tar xz
          sudo mv supabase /usr/local/bin/

      - name: Dump schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.target }}" = "nashville" ]; then
            PROJECT_REF="alozyneyvvtjekiyqdyb"
          else
            PROJECT_REF="mpxgxfqdbquzkrvvejkh"
          fi
          supabase db dump \
            --project-ref "$PROJECT_REF" \
            --schema-only \
            -f schema.sql
          echo "Lines: $(wc -l < schema.sql)"
          head -50 schema.sql

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-${{ inputs.target }}-${{ github.run_id }}
          path: schema.sql
          retention-days: 1
