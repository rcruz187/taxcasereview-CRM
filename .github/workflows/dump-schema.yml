name: Dump Schema
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project to dump: tcr or nashville'
        required: true
        default: 'tcr'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        run: |
          # Use the official install script
          curl -fsSL https://raw.githubusercontent.com/supabase/cli/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          supabase --version

      - name: Dump schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.target }}" = "nashville" ]; then
            PROJECT_REF="alozyneyvvtjekiyqdyb"
          else
            PROJECT_REF="mpxgxfqdbquzkrvvejkh"
          fi
          echo "Dumping project: $PROJECT_REF"
          supabase db dump \
            --project-ref "$PROJECT_REF" \
            --schema-only \
            -f schema.sql
          echo "Done. Lines: $(wc -l < schema.sql)"

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-${{ inputs.target }}-${{ github.run_id }}
          path: schema.sql
          retention-days: 1
          if-no-files-found: warn

      - name: Post error summary if failed
        if: failure()
        run: |
          echo "Dump failed — check step logs above"
          cat schema.sql 2>/dev/null | head -20 || echo "schema.sql not created"
