name: Dump Schema
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project to dump: tcr or nashville'
        required: true
        default: 'tcr'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        run: |
          LATEST=$(curl -sf https://api.github.com/repos/supabase/cli/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          echo "CLI version: $LATEST"
          curl -fsSL "https://github.com/supabase/cli/releases/download/${LATEST}/supabase_linux_amd64.tar.gz" \
            -o supabase.tar.gz
          tar xzf supabase.tar.gz
          sudo mv supabase /usr/local/bin/supabase
          supabase --version

      - name: Dump schema and capture output
        id: dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.target }}" = "nashville" ]; then
            PROJECT_REF="alozyneyvvtjekiyqdyb"
          else
            PROJECT_REF="mpxgxfqdbquzkrvvejkh"
          fi
          echo "Dumping $PROJECT_REF..."
          # Capture both stdout and stderr
          supabase db dump --project-ref "$PROJECT_REF" --schema-only -f schema.sql > dump_stdout.txt 2> dump_stderr.txt
          EXIT_CODE=$?
          echo "Exit code: $EXIT_CODE"
          echo "STDOUT:"
          cat dump_stdout.txt
          echo "STDERR:"
          cat dump_stderr.txt
          
          if [ -f schema.sql ]; then
            echo "Schema produced: $(wc -l < schema.sql) lines"
          else
            echo "schema.sql NOT produced"
          fi
          
          # Post result as issue
          BODY="## Dump result\n\nExit: $EXIT_CODE\n\n### STDOUT\n\`\`\`\n$(cat dump_stdout.txt | head -50)\n\`\`\`\n\n### STDERR\n\`\`\`\n$(cat dump_stderr.txt | head -50)\n\`\`\`\n\n### Schema lines\n$(wc -l < schema.sql 2>/dev/null || echo 'none')"
          
          gh api repos/${{ github.repository }}/issues \
            -X POST \
            -f title="dump-result-${{ github.run_id }}" \
            -f body="$BODY" \
            --silent
          
          exit $EXIT_CODE
