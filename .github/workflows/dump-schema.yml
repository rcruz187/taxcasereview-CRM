name: Dump Schema
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project to dump: tcr or nashville'
        required: true
        default: 'tcr'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        run: |
          # Download latest release binary directly
          LATEST=$(curl -sf https://api.github.com/repos/supabase/cli/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          echo "Latest CLI: $LATEST"
          curl -fsSL "https://github.com/supabase/cli/releases/download/${LATEST}/supabase_linux_amd64.tar.gz" \
            -o supabase.tar.gz
          tar xzf supabase.tar.gz
          sudo mv supabase /usr/local/bin/supabase
          supabase --version

      - name: Dump schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.target }}" = "nashville" ]; then
            PROJECT_REF="alozyneyvvtjekiyqdyb"
          else
            PROJECT_REF="mpxgxfqdbquzkrvvejkh"
          fi
          echo "Dumping project: $PROJECT_REF"
          supabase db dump \
            --project-ref "$PROJECT_REF" \
            --schema-only \
            -f schema.sql 2>&1
          ls -la schema.sql 2>/dev/null || echo "schema.sql not produced"
          wc -l schema.sql 2>/dev/null || true

      - name: Upload schema artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-${{ inputs.target }}-${{ github.run_id }}
          path: schema.sql
          retention-days: 1
          if-no-files-found: warn
