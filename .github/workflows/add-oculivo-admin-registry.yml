name: Add Oculivo Admin Registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-oculivo-admin-registry.yml'

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Add Oculivo to Admin Portal product registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminPortal.jsx')
          s=p.read_text()
          if "key:        'oculivo'" in s or "key:       'oculivo'" in s:
              print('Oculivo already present')
          else:
              marker="""  // ── TENANTS (not products — operational data, not product counts) ─────────"""
              if marker not in s:
                  raise SystemExit('tenant marker not found')
              block="""  {
    key:        'oculivo',
    label:      'Oculivo',
    icon:       '👁️',
    color:      '#7C3AED',
    industry:   'Eye Care',
    url:        'https://app.oculivo.com',
    appUrl:     'https://app.oculivo.com',
    websiteUrl: 'https://oculivo.com',
    lifecycleStage: 'building',
    connection:     'partial',
    brandStatus:    'branded',
    publicOnRomyLabs: true,
    commerciallyAvailable: false,
    desc:      'Eye-care CRM and practice operating system for optometry, ophthalmology, optical retail, and multi-location groups.',
    metricsUrl: null,
    nextMilestone: 'Finish product build, deploy platform metrics, and verify analytics reporting',
  },

"""
              s=s.replace(marker, block+marker, 1)
              s=s.replace('TaxRes CRM (platform), Camvella, Arcvena, BocaSync, GroundIVO, + planned verticals', 'TaxRes CRM (platform), Camvella, Arcvena, BocaSync, GroundIVO, Oculivo, + planned verticals', 1)
              p.write_text(s)
          PY
      - name: Verify registry and admin auth regression gate
        run: |
          grep -F "key:        'oculivo'" src/pages/AdminPortal.jsx
          grep -F "label:      'Oculivo'" src/pages/AdminPortal.jsx
          grep -F "websiteUrl: 'https://oculivo.com'" src/pages/AdminPortal.jsx
          grep -F "appUrl:     'https://app.oculivo.com'" src/pages/AdminPortal.jsx
          grep -F "SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM" src/App.jsx
          grep -F "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -F "if (isPlatformOwner(user?.email)) return null" src/App.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source fix
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "fix(admin): register Oculivo in Command Center" || true
          git push
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
