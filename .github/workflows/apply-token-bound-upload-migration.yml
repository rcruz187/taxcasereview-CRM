name: Apply Token-Bound Upload Migration

on:
  push:
    paths:
      - '.github/scripts/migrate_public_uploads_to_token_edges.py'
      - '.github/workflows/apply-token-bound-upload-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move public uploads behind token-bound Edge Functions
        run: python .github/scripts/migrate_public_uploads_to_token_edges.py
      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'actions@github.com'
          git add src/pages/ClientPortal.jsx src/components/OrganizerWizard.jsx
          git commit -m 'fix(security): route public uploads through token-bound functions'
          git push origin HEAD:main
