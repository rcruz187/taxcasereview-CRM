name: Add RomyLabs Credential Vault

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-credential-vault.yml'

permissions:
  contents: write

jobs:
  wire-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Wire credential vault into Admin Portal
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/AdminPortal.jsx')
          s = p.read_text()

          import_anchor = "import TrafficCoverage from '../components/admin/TrafficCoverage'\n"
          import_line = "import CredentialVault from '../components/admin/CredentialVault'\n"
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('TrafficCoverage import anchor not found; refusing broad patch')
              s = s.replace(import_anchor, import_anchor + import_line, 1)

          nav_anchor = "  { path:'/crm-admin/traffic',        label:'Traffic Coverage', icon:'🌐' },\n"
          nav_line = "  { path:'/crm-admin/vault',          label:'Credential Vault', icon:'🔐' },\n"
          if nav_line not in s:
              if nav_anchor not in s:
                  raise SystemExit('Traffic Coverage nav anchor not found; refusing broad patch')
              s = s.replace(nav_anchor, nav_anchor + nav_line, 1)

          route_anchor = '            <Route path="/traffic"        element={<AdminRouteErrorBoundary><TrafficCoverage/></AdminRouteErrorBoundary>}/>\n'
          route_line = '            <Route path="/vault"          element={<AdminRouteErrorBoundary><CredentialVault/></AdminRouteErrorBoundary>}/>\n'
          if route_line not in s:
              if route_anchor not in s:
                  raise SystemExit('Traffic Coverage route anchor not found; refusing broad patch')
              s = s.replace(route_anchor, route_anchor + route_line, 1)

          p.write_text(s)

      - name: Verify vault wiring and permanent admin security gate
        run: |
          test -f src/components/admin/CredentialVault.jsx
          grep -q "CredentialVault from '../components/admin/CredentialVault'" src/pages/AdminPortal.jsx
          grep -q "'/crm-admin/vault'" src/pages/AdminPortal.jsx
          grep -q 'path="/vault"' src/pages/AdminPortal.jsx
          grep -q "SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM" src/App.jsx
          grep -q "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -q "if (isPlatformOwner(user?.email)) return null" src/App.jsx
          grep -q "Never expose a tenant/demo shell on the RomyLabs admin hostname" src/App.jsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit vault wiring
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "feat(admin): wire encrypted credential vault"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
