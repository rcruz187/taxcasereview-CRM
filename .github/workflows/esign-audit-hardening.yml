name: E-Sign Audit Hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/esign-audit-hardening.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Apply audited e-sign fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/pages/ESignaturesHub.jsx')
          s=p.read_text()
          old="""              <UniversalOfficeESign\n                supabase={supabase}"""
          new="""              <UniversalOfficeESign\n                key={`${selected.product_key||'romylabs'}:${selected.external_office_id||selected.id}`}\n                supabase={supabase}"""
          if old not in s and 'key={`${selected.product_key' not in s: raise SystemExit('ESignaturesHub anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/pages/OfficeDocumentSign.jsx')
          s=p.read_text()
          s=s.replace("  const [signature,setSignature]=useState('')\n", "  const [signature,setSignature]=useState('')\n  const [consent,setConsent]=useState(false)\n",1)
          s=s.replace("    const fields=doc?.fields||[]\n    let sig=signature\n", "    const fields=doc?.fields||[]\n    if(!consent){setError('You must consent to electronic records and signatures before finishing.');return}\n    let sig=signature\n",1)
          s=s.replace("body:{action:'esign_sign',token,signature_name:sig,values}", "body:{action:'esign_sign',token,signature_name:sig,values,consent:true}",1)
          old="""    {!done&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginTop:16,flexWrap:'wrap'}}><div style={{fontSize:11,color:'#64748b'}}>By clicking Finish & Sign, you agree to use an electronic signature for this document.</div><button disabled={working} onClick={finish} style={{...primaryBtn,background:'#059669'}}>{working?'Applying Signature…':'Finish & Sign'}</button></div>}"""
          new="""    {!done&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginTop:16,flexWrap:'wrap'}}><label style={{fontSize:11,color:'#475569',display:'flex',gap:8,alignItems:'flex-start',maxWidth:650}}><input type=\"checkbox\" checked={consent} onChange={e=>setConsent(e.target.checked)} style={{marginTop:2}}/><span>I agree to use electronic records and signatures and intend the signature I adopt above to be legally binding for this document.</span></label><button disabled={working||!consent} onClick={finish} style={{...primaryBtn,background:'#059669',opacity:working||!consent?.55:1}}>{working?'Applying Signature…':'Finish & Sign'}</button></div>}"""
          if old not in s and 'I agree to use electronic records' not in s: raise SystemExit('OfficeDocumentSign footer anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('supabase/functions/office-agreement-file/index.ts')
          s=p.read_text()
          s=s.replace("      if(!signatureName)return json({error:'Signature name is required'},400)\n", "      if(!signatureName)return json({error:'Signature name is required'},400)\n      if(b.consent!==true)return json({error:'Electronic signature consent is required'},400)\n",1)
          old="""      const signedPath=`${doc.product_key}/${doc.external_office_id}/${doc.id}/signed-${safeFile(doc.source_filename)}`\n      const {error:up}=await admin.storage.from(ESIGN_BUCKET).upload(signedPath,finalBytes,{contentType:'application/pdf',upsert:true})\n      if(up)return json({error:'Could not save signed document: '+up.message},500)\n      const now=new Date().toISOString()\n      const audit=[...(Array.isArray(doc.audit)?doc.audit:[]),{event:'signed',at:now,signer:signatureName,email:doc.signer_email,ip:ip(req),user_agent:req.headers.get('user-agent')}]\n      const {error:upd}=await admin.from('romylabs_office_signing_documents').update({status:'signed',signed_path:signedPath,signed_at:now,signature_name:signatureName,signer_ip:ip(req),signer_user_agent:req.headers.get('user-agent'),audit,updated_at:now}).eq('id',doc.id).in('status',['sent','viewed'])\n      if(upd)return json({error:'Could not finalize signature'},500)\n      return json({ok:true,signed_at:now})"""
          new="""      const signedPath=`${doc.product_key}/${doc.external_office_id}/${doc.id}/signed-${crypto.randomUUID()}-${safeFile(doc.source_filename)}`\n      const {error:up}=await admin.storage.from(ESIGN_BUCKET).upload(signedPath,finalBytes,{contentType:'application/pdf',upsert:false})\n      if(up)return json({error:'Could not save signed document: '+up.message},500)\n      const now=new Date().toISOString()\n      const audit=[...(Array.isArray(doc.audit)?doc.audit:[]),{event:'signed',at:now,signer:signatureName,email:doc.signer_email,consent_to_esign:true,ip:ip(req),user_agent:req.headers.get('user-agent')}]\n      const {data:updated,error:upd}=await admin.from('romylabs_office_signing_documents').update({status:'signed',signed_path:signedPath,signed_at:now,signature_name:signatureName,signer_ip:ip(req),signer_user_agent:req.headers.get('user-agent'),audit,updated_at:now}).eq('id',doc.id).in('status',['sent','viewed']).select('id').maybeSingle()\n      if(upd){await admin.storage.from(ESIGN_BUCKET).remove([signedPath]);return json({error:'Could not finalize signature'},500)}\n      if(!updated){await admin.storage.from(ESIGN_BUCKET).remove([signedPath]);return json({error:'This document was already signed or is no longer signable'},409)}\n      return json({ok:true,signed_at:now})"""
          if old not in s and 'crypto.randomUUID()' not in s: raise SystemExit('office-agreement-file concurrency anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Audit critical e-sign controls
        run: |
          grep -q 'key={`${selected.product_key' src/pages/ESignaturesHub.jsx
          grep -q 'I agree to use electronic records and signatures' src/pages/OfficeDocumentSign.jsx
          grep -q 'consent:true' src/pages/OfficeDocumentSign.jsx
          grep -q 'Electronic signature consent is required' supabase/functions/office-agreement-file/index.ts
          grep -q 'crypto.randomUUID()' supabase/functions/office-agreement-file/index.ts
          grep -q 'upsert:false' supabase/functions/office-agreement-file/index.ts
          grep -q 'consent_to_esign:true' supabase/functions/office-agreement-file/index.ts
      - name: Commit audited fixes
        run: |
          git config user.name 'RomyLabs E-Sign Audit'
          git config user.email 'romy@romylabs.com'
          git add src/pages/ESignaturesHub.jsx src/pages/OfficeDocumentSign.jsx supabase/functions/office-agreement-file/index.ts
          git diff --cached --quiet || git commit -m 'fix(esign): close audit findings in universal signing flow'
          git push origin HEAD:main
