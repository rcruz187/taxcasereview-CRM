name: Add RomyLabs SEO
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-romylabs-seo.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Apply isolated RomyLabs SEO patch
        run: node scripts/add-romylabs-seo.cjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify isolated integration
        run: |
          grep -q "label:     'RomyLabs Corporate'" src/pages/AdminPortal.jsx
          grep -q "key:       'romylabs'" src/pages/AdminPortal.jsx
          grep -q "romylabs: \['sc-domain:romylabs.com'" supabase/functions/gsc-data/index.ts
          git diff --check
      - name: Commit integration
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx supabase/functions/gsc-data/index.ts
          git diff --cached --quiet || git commit -m 'feat(seo): add RomyLabs corporate reporting property'
          git push origin HEAD:main
