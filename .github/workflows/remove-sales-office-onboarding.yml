name: Remove Sales Office Onboarding UI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove_sales_office_onboarding.py'
      - '.github/workflows/remove-sales-office-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Sales UI
        run: python .github/scripts/remove_sales_office_onboarding.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/AdminPortal.jsx .github/scripts/move_esign_to_office.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'fix(sales): remove office onboarding controls from prospect drawer'
          git push
