name: Fix Nashville Auth
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Get user state to verify
        run: |
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/4f1f0d1a-eeec-41ef-9368-99a29cc83aee" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | \
            python3 -c "
import json,sys
d=json.load(sys.stdin)
print('email:', d.get('email'))
print('updated_at:', d.get('updated_at'))
print('created_at:', d.get('created_at'))
print('confirmation_sent_at:', d.get('confirmation_sent_at'))
print('identities:', len(d.get('identities',[])))
"
