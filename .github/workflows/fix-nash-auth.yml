name: Fix Nashville Auth
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Reset password via Supabase Admin API
        run: |
          RESULT=$(curl -s -X PUT \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/4f1f0d1a-eeec-41ef-9368-99a29cc83aee" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"password":"Nashville2026!","email_confirm":true}')
          echo "API Response: $RESULT"
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print('email:', d.get('email')); print('updated_at:', d.get('updated_at'))" 2>/dev/null || echo "Parse failed"
