name: Apply Inline Fax Hardening

on:
  push:
    paths:
      - '.github/scripts/harden_inline_fax.py'
      - '.github/workflows/apply-inline-fax-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden inline fax workflows
        run: python .github/scripts/harden_inline_fax.py
      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'actions@github.com'
          git add src/pages/Leads.jsx src/pages/Clients.jsx
          git commit -m 'fix(fax): harden inline sends and provider failures'
          git push origin HEAD:main
