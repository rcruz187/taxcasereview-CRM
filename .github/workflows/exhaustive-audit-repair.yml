name: Exhaustive Audit Repair

on:
  push:
    branches: [main]
    paths: ['.github/workflows/exhaustive-audit-repair.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply audited source repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Remove dangerous copy/paste SQL from Tax Returns UI. Database
          # provisioning is migration-owned; the old helper granted anon ALL.
          p=Path('src/pages/TaxReturns.jsx')
          s=p.read_text()
          s,n=re.subn(r"const SQL_SETUP = `create table if not exists tax_returns \([\s\S]*?create policy \"anon_all\" on tax_returns for all using \(true\) with check \(true\);`", "const SQL_SETUP = `Tax Returns database setup is managed by secure Supabase migrations. Contact a platform administrator if this module reports that setup is required.`", s, count=1)
          if n != 1:
            raise SystemExit('TaxReturns SQL_SETUP replacement did not match exactly once')
          p.write_text(s)

          # 2) Never silently discard tax-document persistence failures.
          p=Path('src/components/TaxDocParser.jsx')
          s=p.read_text()
          old="try { await supabase.from('tax_doc_uploads').insert(inserts) } catch (_) {}"
          new="""try {
        const { error: saveError } = await supabase.from('tax_doc_uploads').insert(inserts)
        if (saveError) console.error('Failed to persist parsed tax-document metadata:', saveError)
      } catch (saveError) {
        console.error('Failed to persist parsed tax-document metadata:', saveError)
      }"""
          if old not in s: raise SystemExit('TaxDocParser target not found')
          p.write_text(s.replace(old,new,1))

          # 3) Quarantine the obsolete standalone SignalWire backend. Production
          # telephony uses Supabase Edge Functions. No live tenant has a
          # signalwire_backend configured, so this legacy server must not expose
          # unauthenticated dialer/SMS/fax endpoints if accidentally deployed.
          p=Path('signalwire-backend/server.js')
          s=p.read_text()
          marker='''app.get("/health", (req, res) => res.json({\n  status: "ok",\n  service: "Tax Case Review — SignalWire Backend",\n  features: ["dialer","sms","efax"],\n  space: SW_SPACE, phone: SW_PHONE\n}))'''
          replacement=marker+'''\n\n// Legacy backend quarantine: production telephony is served by authenticated\n// Supabase Edge Functions. Any accidental deployment of this old Express app\n// fails closed unless an explicit shared secret is configured and supplied.\napp.use((req, res, next) => {\n  const expected = process.env.LEGACY_BACKEND_SHARED_SECRET\n  const provided = req.get('x-legacy-backend-key')\n  if (!expected || !provided || provided !== expected) {\n    return res.status(410).json({ error: 'Legacy SignalWire backend disabled' })\n  }\n  next()\n})'''
          if marker not in s: raise SystemExit('SignalWire health marker not found')
          p.write_text(s.replace(marker,replacement,1))
          PY

      - name: Build and verify
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
          ! git grep -n 'create policy "anon_all" on tax_returns' -- src/pages/TaxReturns.jsx
          git diff --check

      - name: Commit repairs and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/TaxReturns.jsx src/components/TaxDocParser.jsx signalwire-backend/server.js
          git commit -m 'security: close exhaustive source audit findings'
          git rm .github/workflows/exhaustive-audit-repair.yml
          git commit -m 'chore: remove one-shot audit repair workflow'
          git push origin main