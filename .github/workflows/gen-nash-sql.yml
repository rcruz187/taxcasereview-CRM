name: Generate Nashville SQL
on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Table name'
        required: true
        default: 'clients'
      offset:
        description: 'Offset'
        required: true
        default: '0'
      limit:
        description: 'Limit'
        required: true
        default: '500'

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate INSERT SQL
        run: |
          python3 << 'PYEOF'
import json, subprocess, os, sys

TABLE = "${{ github.event.inputs.table }}"
OFFSET = int("${{ github.event.inputs.offset }}")
LIMIT = int("${{ github.event.inputs.limit }}")
TCR = "mpxgxfqdbquzkrvvejkh"
NAS = "ydrvncdedgjtcprczwpu"
NASH = "489ace07-1a6b-4864-833a-4f8420568b40"
TOKEN = os.environ['SUPABASE_ACCESS_TOKEN']

def query(ref, sql):
    r = subprocess.run([
        'curl', '-s', '-X', 'POST',
        f'https://api.supabase.com/v1/projects/{ref}/database/query',
        '-H', f'Authorization: Bearer {TOKEN}',
        '-H', 'Content-Type: application/json',
        '-d', json.dumps({'query': sql})
    ], capture_output=True, text=True, timeout=60)
    try:
        return json.loads(r.stdout)
    except:
        print(f"Error: {r.stdout[:200]}", file=sys.stderr)
        return []

def val(v):
    if v is None: return 'NULL'
    if isinstance(v, bool): return 'true' if v else 'false'
    if isinstance(v, (int, float)): return str(v)
    if isinstance(v, (dict, list)): return "'" + json.dumps(v).replace("'", "''") + "'"
    return "'" + str(v).replace("'", "''") + "'"

rows = query(TCR, f"SELECT * FROM {TABLE} WHERE tenant_id='{NASH}' ORDER BY created_at LIMIT {LIMIT} OFFSET {OFFSET}")
if not rows or not isinstance(rows, list):
    print(f"No rows returned", file=sys.stderr)
    sys.exit(1)

print(f"-- {TABLE} rows {OFFSET} to {OFFSET+len(rows)}", file=sys.stderr)

# Write to file
lines = [f"-- Nashville {TABLE} INSERT batch offset={OFFSET}"]
if rows:
    cols = list(rows[0].keys())
    col_str = ','.join(f'"{c}"' for c in cols)
    for row in rows:
        vals = ','.join(val(row[c]) for c in cols)
        lines.append(f"INSERT INTO {TABLE} ({col_str}) VALUES ({vals}) ON CONFLICT (id) DO NOTHING;")

sql = '\n'.join(lines)
with open(f'/tmp/nash_{TABLE}_{OFFSET}.sql', 'w') as f:
    f.write(sql)

print(f"Generated {len(rows)} INSERT statements", file=sys.stderr)

# Now run them directly against Nashville
print("Running inserts against Nashville...", file=sys.stderr)
result = query(NAS, sql.replace('\n', ' '))
print(f"Result: {str(result)[:200]}", file=sys.stderr)

# Verify count
count = query(NAS, f"SELECT COUNT(*) as cnt FROM {TABLE} WHERE tenant_id='{NASH}'")
print(f"Nashville {TABLE} count after: {count}", file=sys.stderr)
PYEOF

      - name: Upload SQL
        uses: actions/upload-artifact@v4
        with:
          name: nash-sql-${{ github.event.inputs.table }}-${{ github.event.inputs.offset }}
          path: /tmp/nash_${{ github.event.inputs.table }}_${{ github.event.inputs.offset }}.sql
          retention-days: 1
          if-no-files-found: warn
