name: Harden TaxRes Demo Account

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-taxres-demo-account.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply demo hardening
        run: python scripts/harden-taxres-demo.py
      - name: Verify demo hardening
        run: |
          grep -q "isDemoMailbox" src/pages/Email.jsx
          grep -q "Demo Mailbox" src/pages/Email.jsx
          grep -q "sandbox only" src/pages/Email.jsx
          grep -q "DEMO LOGIN + SALES MAILBOX" supabase/migrations/demo_reset_seed.sql
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Commit hardened demo source
        run: |
          git config user.name RomyLabs
          git config user.email rcruz187@gmail.com
          git add src/pages/Email.jsx supabase/migrations/demo_reset_seed.sql
          git commit -m "fix(demo): wire dedicated TaxRes sales demo account"
          git push origin main
