name: Nashville Auth Fix
on:
  push:
    paths:
      - '.github/workflows/nash-verify-auth.yml'
permissions:
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Enable mailer autoconfirm
        run: |
          RESULT=$(curl -s -X PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"mailer_autoconfirm":true}')
          echo "Result: $RESULT"
      - name: Create Nashville admin user
        run: |
          RESULT=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@nashvilletaxsolutions.com","password":"Nashville2026!","email_confirm":true}')
          echo "Create result: $RESULT"
      - name: Post result to issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo taxresolutioncrm/taxcasereview-CRM \
            --title "nash-user-created" \
            --body "done"
