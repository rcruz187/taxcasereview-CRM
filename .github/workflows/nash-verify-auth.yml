name: Nashville Auth Fix
on:
  push:
    paths:
      - '.github/workflows/nash-verify-auth.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Check auth config and save
        run: |
          mkdir -p out
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" > out/config.json
          cat out/config.json
      - uses: actions/upload-artifact@v4
        with:
          name: auth-config
          path: out/
