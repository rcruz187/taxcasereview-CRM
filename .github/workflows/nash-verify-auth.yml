name: Nashville Auth Fix
on:
  push:
    paths:
      - '.github/workflows/nash-verify-auth.yml'
permissions:
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get auth config and post to issue
        run: |
          CONFIG=$(curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ['disable_signup','mailer_autoconfirm','external_email_enabled','smtp_host','rate_limit_email_sent','smtp_admin_email'] if k in d}))") 
          curl -s -X POST \
            "https://api.github.com/repos/taxresolutioncrm/taxcasereview-CRM/issues" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"auth-config-result\",\"body\":\"${CONFIG}\"}"
