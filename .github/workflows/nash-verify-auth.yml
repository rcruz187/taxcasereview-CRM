name: Nashville Auth Verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Check and fix user
        run: |
          echo "=== GET USER ==="
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/4f1f0d1a-eeec-41ef-9368-99a29cc83aee" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print('email:', d.get('email'))
print('updated_at:', d.get('updated_at'))
print('identities:', len(d.get('identities',[])))
if d.get('identities'):
    print('identity provider_id:', d['identities'][0].get('provider_id'))
"
          echo ""
          echo "=== RESET PASSWORD ==="
          curl -s -X PUT \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/4f1f0d1a-eeec-41ef-9368-99a29cc83aee" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"password":"Nashville2026!","email_confirm":true}' | python3 -c "
import json,sys
d=json.load(sys.stdin)
print('updated email:', d.get('email'))
print('updated_at:', d.get('updated_at'))
print('error:', d.get('error_description', d.get('msg', 'none')))
"
