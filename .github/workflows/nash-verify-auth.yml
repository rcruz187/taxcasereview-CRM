name: Nashville Auth Fix
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      USER_ID: 4f1f0d1a-eeec-41ef-9368-99a29cc83aee
    steps:
      - name: Delete user
        run: |
          DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/${USER_ID}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          echo "Delete HTTP: $DEL"
          sleep 2
      - name: Create user
        run: |
          RESULT=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@nashvilletaxsolutions.com","password":"Nashville2026!","email_confirm":true}')
          echo "Create result: $RESULT"
          BODY=$(echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'id: {d.get(chr(105)+chr(100))} email: {d.get(chr(101)+chr(109)+chr(97)+chr(105)+chr(108))} updated_at: {d.get(chr(117)+chr(112)+chr(100)+chr(97)+chr(116)+chr(101)+chr(100))+chr(95)+chr(97)+chr(116)}')" 2>/dev/null || echo "$RESULT")
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/issues" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"nash-auth-result ${{ github.run_id }}\",\"body\":\"$BODY\"}"
