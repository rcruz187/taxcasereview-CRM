name: Nashville Auth Fix
on:
  push:
    paths:
      - '.github/workflows/nash-verify-auth.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Get GoTrue logs and user state
        run: |
          echo "=== Auth service logs ==="
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/logs?service=auth&limit=20" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
          echo ""
          echo "=== User via admin API ==="
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/4f1f0d1a-eeec-41ef-9368-99a29cc83aee" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print('id:', d.get('id'))
print('email:', d.get('email'))
print('updated_at:', d.get('updated_at'))
print('identities:', len(d.get('identities',[])))
for i in d.get('identities',[]):
    print('  identity provider_id:', i.get('provider_id'))
    print('  identity data:', i.get('identity_data'))
"
