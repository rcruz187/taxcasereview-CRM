name: Nashville Auth Fix
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://mpxgxfqdbquzkrvvejkh.supabase.co
      SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
      USER_ID: 4f1f0d1a-eeec-41ef-9368-99a29cc83aee
    steps:
      - name: Reset password via Admin API
        run: |
          echo "=== Attempting password reset via Management API ==="
          RESULT=$(curl -s -X PUT \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/${USER_ID}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"password":"Nashville2026!","email_confirm":true}')
          echo "Management API result: $RESULT"

      - name: Verify via user list
        run: |
          echo "=== Checking user state ==="
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users?page=1&per_page=100" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | \
            python3 -c "
import json,sys
data=json.load(sys.stdin)
users=data.get('users',[])
print('Total users found:', len(users))
for u in users:
    if 'nashville' in u.get('email','').lower():
        print('User ID:', u['id'])
        print('Email:', u['email'])
        print('Updated at:', u.get('updated_at'))
        print('Identities:', len(u.get('identities',[])))
        for i in u.get('identities',[]):
            print('  -', i.get('provider'), '/', i.get('provider_id'))
" 2>&1 || echo "Parse failed"
