name: Nashville Auth Fix
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
      USER_ID: 4f1f0d1a-eeec-41ef-9368-99a29cc83aee
    steps:
      - name: Reset password and verify
        run: |
          echo "=== Reset password ==="
          RESULT=$(curl -s -X PUT \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users/${USER_ID}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"password":"Nashville2026!","email_confirm":true}')
          echo "Result: $RESULT"
          echo "=== Get user list ==="
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users?page=1&per_page=100" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | \
            python3 -c "
import json,sys
data=json.load(sys.stdin)
users=data.get('users',[])
print('Users:', len(users))
for u in users:
    if 'nashville' in u.get('email','').lower():
        print('ID:', u['id'])
        print('Updated:', u.get('updated_at'))
        print('Identities:', len(u.get('identities',[])))
"
