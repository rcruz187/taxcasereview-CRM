name: Nashville Auth Fix
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'get or reset'
        default: 'get'
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Check user state
        run: |
          echo "=== Listing users ==="
          curl -s "https://api.supabase.com/v1/projects/${PROJECT_REF}/auth/users?page=1&per_page=50" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | \
            python3 -c "
import json,sys
data=json.load(sys.stdin)
users=data.get('users',[])
print(f'Total users: {len(users)}')
for u in users:
    if 'nashville' in u.get('email','').lower():
        print('FOUND:', u.get('id'), u.get('email'), u.get('updated_at'))
        ids=u.get('identities',[])
        print('  identities:', len(ids))
        for i in ids:
            print('  identity:', i.get('provider'), i.get('provider_id'))
"
