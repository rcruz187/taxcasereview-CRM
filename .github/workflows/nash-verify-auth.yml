name: Nashville Auth Fix
on:
  push:
    paths:
      - '.github/workflows/nash-verify-auth.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Restart auth service
        run: |
          echo '=== Restarting GoTrue auth service ==='
          curl -s -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/services/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"service":"gotrue"}'
          echo ''
          echo '=== Also try general restart ==='
          curl -s -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
