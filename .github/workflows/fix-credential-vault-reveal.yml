name: Fix Credential Vault Reveal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-credential-vault-reveal.yml'

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Patch isolated vault re-auth
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/supabase.js')
          s = p.read_text()
          marker = "export const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {\n"
          helper = """export function createEphemeralAuthClient() {
            return createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
              auth: {
                persistSession: false,
                autoRefreshToken: false,
                detectSessionInUrl: false,
              },
              global: { fetch: secureFetch },
            })
          }

          """
          if 'createEphemeralAuthClient' not in s:
            if marker not in s:
              raise SystemExit('supabase client anchor missing')
            s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          p = Path('src/components/admin/CredentialVault.jsx')
          s = p.read_text()
          s = s.replace("import { supabase } from '../../lib/supabase'", "import { supabase, createEphemeralAuthClient } from '../../lib/supabase'", 1)
          old = """    const { error } = await supabase.auth.signInWithPassword({ email:user.email, password:unlockPassword })
    setBusy(false)
    if (error) { notify('Password verification failed'); return }
"""
          new = """    const verifier = createEphemeralAuthClient()
    const { error } = await verifier.auth.signInWithPassword({ email:user.email, password:unlockPassword })
    try { await verifier.auth.signOut() } catch (_) {}
    setBusy(false)
    if (error) { notify('Password verification failed'); return }
"""
          if old not in s:
            raise SystemExit('vault re-auth anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Verify narrow patch and admin security boundary
        run: |
          grep -q 'createEphemeralAuthClient' src/lib/supabase.js
          grep -q 'const verifier = createEphemeralAuthClient()' src/components/admin/CredentialVault.jsx
          grep -q 'persistSession: false' src/lib/supabase.js
          grep -q 'SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM' src/App.jsx
          grep -q 'if (!isAdminHost) return <Shell />' src/App.jsx
          grep -q 'if (isPlatformOwner(user?.email)) return null' src/App.jsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/lib/supabase.js src/components/admin/CredentialVault.jsx
          git commit -m "fix(admin): isolate vault password verification"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
