name: UI Control Audit
on:
  push:
    paths:
      - 'scripts/audit-ui-controls.mjs'
      - '.github/workflows/audit-ui-controls.yml'
      - 'src/pages/**'
      - 'src/components/**'
  workflow_dispatch:

jobs:
  controls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scan for inert buttons
        run: node scripts/audit-ui-controls.mjs
