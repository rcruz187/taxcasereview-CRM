name: Run SEO Live Status Fix

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fix-seo-live-status.cjs'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply SEO status patch
        run: node scripts/fix-seo-live-status.cjs
      - name: Verify SEO and admin auth guards
        run: |
          grep -F "seoConnectedProducts.includes(p.key)" src/pages/AdminPortal.jsx
          grep -F "eq('channel_key','search_console')" src/pages/AdminPortal.jsx
          grep -F "seoConnectedProducts={gscLiveProducts}" src/pages/AdminPortal.jsx
          grep -F "SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM" src/App.jsx
          grep -F "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -F "if (isPlatformOwner(user?.email)) return null" src/App.jsx
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source patch
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "fix(seo): show all live GSC products from traffic registry" || true
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
