name: Inspect RomyLabs Rebuild Trigger
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-romylabs-rebuild-trigger.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
      GH_CF_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK_ROMYLABS }}
    steps:
      - name: Inspect live trigger function + Vault secret names
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/q.json
          import json
          q=r'''
          select jsonb_build_object(
            'trigger_function',(select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='notify_romylabs_site_rebuild' limit 1),
            'vault_names',(select coalesce(jsonb_agg(name order by name),'[]'::jsonb) from vault.decrypted_secrets where name in ('CF_PAGES_DEPLOY_HOOK_ROMYLABS','ROMYLABS_SITE_REBUILD_URL')),
            'pg_net',(select exists(select 1 from pg_extension where extname='pg_net'))
          ) as audit;
          '''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/q.json
      - name: Report GitHub hook availability without exposing it
        shell: bash
        run: |
          if [ -n "${GH_CF_HOOK:-}" ]; then echo 'GITHUB_CF_HOOK_PRESENT=true'; else echo 'GITHUB_CF_HOOK_PRESENT=false'; fi
