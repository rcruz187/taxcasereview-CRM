name: Remove unfinished chat controls
on:
  push:
    paths:
      - '.github/workflows/remove-chat-dead-ui.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Remove disabled Coming Soon controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Chat.jsx')
          s=p.read_text()
          for old in [
            '          <MenuDivider/>\n          <MenuItem disabled title="Coming soon">Summarize conversation</MenuItem>\n',
            '          <MenuDivider/>\n          <MenuItem disabled title="Coming soon">Summarize channel</MenuItem>\n',
          ]:
            if old not in s:
              raise SystemExit('Expected disabled chat control not found')
            s=s.replace(old,'',1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit clean UI
        run: |
          rm .github/workflows/remove-chat-dead-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): remove unfinished summarize controls'
          git push origin HEAD:main