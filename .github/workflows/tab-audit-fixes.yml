name: Tab Audit Fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tab-audit-fixes.yml'
permissions:
  contents: write
jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited tab fixes
        run: |
          node <<'NODE'
          const fs = require('fs')
          const app = 'src/App.jsx'
          let s = fs.readFileSync(app,'utf8')
          const reps = [
            ["const { openModal, realtimeOk } = useApp()", "const { openModal, closeModal, realtimeOk } = useApp()\n  const navigate = useNavigate()"],
            ["].map(([label, _]) => (\n          <button key={label} className=\"btn lg full\" style={{ justifyContent:'flex-start', gap:10 }}>", "].map(([label, path]) => (\n          <button key={label} onClick={() => { closeModal(); navigate(path) }} className=\"btn lg full\" style={{ justifyContent:'flex-start', gap:10 }}>"] ,
            ["<Route path=\"/formacorp\"   element={<Guard section=\"books\"><FormaCorp /></Guard>} />", "<Route path=\"/formacorp\"   element={<Guard section=\"formacorp\"><FormaCorp /></Guard>} />"],
            ["<Route path=\"/fax\"         element={<Guard section=\"email\"><Fax /></Guard>} />", "<Route path=\"/fax\"         element={<Guard section=\"fax\"><Fax /></Guard>} />"]
          ]
          for (const [a,b] of reps) {
            if (!s.includes(a)) throw new Error('Expected App.jsx pattern not found: '+a)
            s=s.replace(a,b)
          }
          fs.writeFileSync(app,s)

          const ctx='src/context/AppContext.jsx'
          s=fs.readFileSync(ctx,'utf8')
          const needle="  email:       'perm_comms',\n  dialer:      'perm_comms',"
          const repl="  email:       'perm_comms',\n  fax:         'perm_comms',\n  dialer:      'perm_comms',"
          if(!s.includes(needle)) throw new Error('email permission mapping pattern missing')
          s=s.replace(needle,repl)
          const needle2="  workflows:   'perm_settings',   // workflows use settings perm — Admin/Super Admin only\n  dashboard:"
          const repl2="  workflows:   'perm_settings',   // workflows use settings perm — Admin/Super Admin only\n  formacorp:   'perm_billing',\n  dashboard:"
          if(!s.includes(needle2)) throw new Error('workflow permission mapping pattern missing')
          s=s.replace(needle2,repl2)
          fs.writeFileSync(ctx,s)
          NODE
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'rcruz187@gmail.com'
          git add src/App.jsx src/context/AppContext.jsx
          git rm .github/workflows/tab-audit-fixes.yml
          git commit -m 'fix(audit): repair quick add and tab permissions'
          git push origin HEAD:main
