name: Wire Universal Office E-Sign

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wire-universal-office-esign.yml'
      - '.github/scripts/wire_universal_office_esign.py'
      - 'src/pages/AdminPortal.jsx'
      - 'src/components/admin/UniversalOfficeESign*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify office e-sign wiring is committed
        run: |
          python .github/scripts/wire_universal_office_esign.py
          git diff --exit-code -- src/pages/AdminPortal.jsx

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
