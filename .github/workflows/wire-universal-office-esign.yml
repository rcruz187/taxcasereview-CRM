name: Wire Universal Office E-Sign

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wire-universal-office-esign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply office e-sign wiring
        run: python .github/scripts/wire_universal_office_esign.py

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source wiring
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "feat(admin): expose universal e-sign inside offices"
            git push
          fi
