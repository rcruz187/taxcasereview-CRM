name: Fix Marketing GA4 Load Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-marketing-ga4-load-regression.yml'

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch Marketing GA4 load dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminPortal.jsx')
          s=p.read_text()
          old="""  useEffect(() => {
    setGa4Data(null)
    if (tab==='marketing' && ga4EnabledProducts.includes(marketingProduct)) loadGA4()
  }, [tab, marketingProduct])"""
          new="""  useEffect(() => {
    setGa4Data(null)
    if (tab==='marketing' && ga4EnabledProducts.includes(marketingProduct)) loadGA4()
  }, [tab, marketingProduct, ga4EnabledProducts])"""
          if old not in s:
              raise SystemExit('GA4 load effect anchor missing; source changed')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify Marketing regression and admin auth gate
        run: |
          grep -F "[tab, marketingProduct, ga4EnabledProducts]" src/pages/AdminPortal.jsx
          grep -F "invoke('ga4-sync', { body: { product_id: marketingProduct } })" src/pages/AdminPortal.jsx
          grep -F ".eq('product_id', marketingProduct).gte('date'" src/pages/AdminPortal.jsx
          grep -F "SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM" src/App.jsx
          grep -F "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -F "if (isPlatformOwner(user?.email)) return null" src/App.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source fix
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "fix(marketing): rerun GA4 load after registry initialization" || true
          git push
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
