name: Deploy Gmail Sync Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-gmail-sync-fix.yml'
      - 'scripts/patch-gmail-idempotent-delete.py'
      - 'supabase/functions/gmail-sync-cron/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply deterministic Gmail delete patch
        run: python scripts/patch-gmail-idempotent-delete.py
      - name: Verify patch markers
        run: |
          grep -q "const alreadyGone = res.status === 404" supabase/functions/gmail-sync-cron/index.ts
          grep -q "owned.slice(i, i + 5).map(processRow)" supabase/functions/gmail-sync-cron/index.ts
      - name: Deploy gmail-sync-cron
        run: supabase functions deploy gmail-sync-cron --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Persist patched function source
        run: |
          if git diff --quiet -- supabase/functions/gmail-sync-cron/index.ts; then
            echo "Source already current"
            exit 0
          fi
          git config user.name "RomyLabs Automation"
          git config user.email "automation@romylabs.com"
          git add supabase/functions/gmail-sync-cron/index.ts
          git commit -m "fix(email): persist idempotent Gmail delete backend"
          git push
