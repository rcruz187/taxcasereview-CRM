name: Run SQL (Supabase Management API)

# Executes a SQL statement against the TCR Supabase project using the
# SUPABASE_ACCESS_TOKEN already stored as a repo secret.
#
# Manual dispatch only. Read-only by default: anything that is not a
# SELECT/WITH/EXPLAIN/SHOW is rejected unless mode is set to the
# APPLY_INTENTIONAL sentinel, matching the deploy workflow's convention.
# This exists so schema inspection and migrations do not require a
# round trip through the Supabase SQL editor.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL to execute'
        required: true
      mode:
        description: "READ_ONLY (default) or APPLY_INTENTIONAL for writes/DDL"
        required: false
        default: 'READ_ONLY'
      project_ref:
        description: "Supabase project ref (leave blank for TCR default)"
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  run-sql:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ github.event.inputs.project_ref != '' && github.event.inputs.project_ref || 'mpxgxfqdbquzkrvvejkh' }}
      SQL_INPUT: ${{ github.event.inputs.sql }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - name: Guard write statements
        run: |
          set -euo pipefail
          FIRST=$(printf '%s' "$SQL_INPUT" | tr -d '\r' | sed -e 's/^[[:space:]]*//' | awk 'NR==1{print toupper($1)}')
          echo "Leading keyword: $FIRST"
          case "$FIRST" in
            SELECT|WITH|EXPLAIN|SHOW|TABLE) READONLY=yes ;;
            *) READONLY=no ;;
          esac
          if [ "$READONLY" = "no" ] && [ "$MODE" != "APPLY_INTENTIONAL" ]; then
            echo "::error::This statement is not read-only and mode is not APPLY_INTENTIONAL."
            echo "::error::Re-dispatch with mode=APPLY_INTENTIONAL if the write is deliberate."
            exit 1
          fi
          echo "Guard passed (readonly=$READONLY, mode=$MODE)"

      - name: Execute
        run: |
          set -uo pipefail
          printf '%s' "$SQL_INPUT" > /tmp/stmt.sql
          jq -Rs '{query: .}' < /tmp/stmt.sql > /tmp/body.json
          HTTP=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/body.json)
          echo "HTTP $HTTP"
          echo "----- RESULT -----"
          jq '.' /tmp/out.json 2>/dev/null || cat /tmp/out.json
          echo "----- END RESULT -----"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "SQL error (HTTP $HTTP) — result posted to issue"
          fi

      - name: Post result to an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Artifact and raw-log downloads live on hosts outside the sandbox
          # allowlist, so the result is echoed back through the Issues API,
          # which is reachable. Issue bodies cap at 65536 chars.
          head -c 60000 /tmp/out.json > /tmp/trunc.json || true
          jq -Rs --arg t "sql-result ${{ github.run_id }}" \
            '{title: $t, body: ("```json\n" + . + "\n```")}' < /tmp/trunc.json > /tmp/issue.json
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            --data-binary @/tmp/issue.json | jq -r '.number' 
