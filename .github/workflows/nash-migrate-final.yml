name: Nash Migrate Final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nash-migrate-final.yml']

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Migrate clients
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/migrate_clients.py
