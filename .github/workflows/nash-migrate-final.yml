name: Nash Migrate Final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nash-migrate-final.yml']

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Migrate all Nashville data
        run: |
          TCR="mpxgxfqdbquzkrvvejkh"
          NAS="ydrvncdedgjtcprczwpu"
          NASH="489ace07-1a6b-4864-833a-4f8420568b40"

          tcr() { curl -s -X POST "https://api.supabase.com/v1/projects/$TCR/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"$1\"}"; }

          nas() { curl -s -X POST "https://api.supabase.com/v1/projects/$NAS/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"$1\"}"; }

          migrate() {
            TABLE=$1
            echo "=== $TABLE ==="

            # Get total count
            TOTAL=$(tcr "SELECT COUNT(*) as cnt FROM $TABLE WHERE tenant_id='$NASH'" | grep -o '"cnt":[0-9]*' | grep -o '[0-9]*')
            echo "Total in TCR: $TOTAL"

            if [ -z "$TOTAL" ] || [ "$TOTAL" = "0" ]; then
              echo "Skipping - no rows"
              return
            fi

            # Process in batches of 50 rows
            OFFSET=0
            BATCH=50
            while [ $OFFSET -lt $TOTAL ]; do
              # Get batch as individual inserts using SQL generation
              SQL=$(tcr "SELECT 'INSERT INTO $TABLE SELECT * FROM json_populate_recordset(NULL::$TABLE, ''' || json_agg(row_to_json(t))::text || ''') ON CONFLICT DO NOTHING;' as stmt FROM (SELECT * FROM $TABLE WHERE tenant_id='$NASH' ORDER BY created_at LIMIT $BATCH OFFSET $OFFSET) t" | grep -o '"stmt":"[^"]*"' | sed 's/"stmt":"//;s/"$//' | sed 's/\\n/ /g')

              if [ -n "$SQL" ]; then
                nas "$SQL" > /dev/null
              fi

              OFFSET=$((OFFSET + BATCH))
              echo "  Processed $OFFSET/$TOTAL"
            done

            # Verify
            COUNT=$(nas "SELECT COUNT(*) as cnt FROM $TABLE WHERE tenant_id='$NASH'" | grep -o '"cnt":[0-9]*' | grep -o '[0-9]*')
            echo "Nashville $TABLE: $COUNT rows"
          }

          migrate clients
          migrate cases
          migrate payment_transactions
          migrate payments
          migrate client_notes
          migrate lead_notes
          migrate leads
          migrate tasks
          migrate calevents
          migrate invoices
          migrate documents
          migrate esigns
          migrate workflow_templates
          migrate workflow_statuses
          migrate workflow_status_categories
          migrate deadlines
          migrate poa_records
          migrate employees

          echo "=== FINAL COUNTS ==="
          nas "SELECT (SELECT COUNT(*) FROM clients WHERE tenant_id='$NASH') as clients, (SELECT COUNT(*) FROM cases WHERE tenant_id='$NASH') as cases, (SELECT COUNT(*) FROM payment_transactions WHERE tenant_id='$NASH') as transactions"
