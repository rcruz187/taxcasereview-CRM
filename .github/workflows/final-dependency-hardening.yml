name: Final dependency hardening
on:
  push:
    paths:
      - '.github/workflows/final-dependency-hardening.yml'
jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Upgrade vulnerable production dependencies
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const p=JSON.parse(fs.readFileSync('package.json','utf8'))
          p.dependencies['pdfjs-dist']='^6.2.108'
          p.dependencies['react-router-dom']='^7.18.0'
          p.dependencies['xlsx']='https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          p.overrides={...(p.overrides||{}),uuid:'^11.1.1'}
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')
          NODE
          npm install --package-lock-only
          npm ci
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
      - name: Commit only after clean build/audit
        run: |
          rm .github/workflows/final-dependency-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/final-dependency-hardening.yml
          git commit -m 'security: upgrade vulnerable production dependencies'
          git push origin HEAD:main