name: Move E-Sign To Office Documents
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260901_romylabs_office_first_agreement_flow.sql'
      - '.github/workflows/move-esign-to-office-documents.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move agreement workflow from Sales to Office Documents
        run: |
          python - <<'PY'
          from pathlib import Path

          # Remove e-sign controls from Sales; Sales only starts office creation.
          p=Path('src/pages/AdminPortal.jsx')
          s=p.read_text()
          s=s.replace("import RomyLabsAgreementPanel from '../components/admin/RomyLabsAgreementPanel'\n",'',1)
          panel="""            <RomyLabsAgreementPanel
              prospect={selected}
              supabase={supabase}
              onChanged={async()=>{ await reload(); if(selected) await loadActivities(selected.id) }}
            />

"""
          cta="""            <div style={{padding:'12px 18px',borderBottom:'1px solid rgba(99,102,241,.08)'}}>
              <div style={{fontSize:9,fontWeight:800,color:'#334155',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:7}}>Office Onboarding</div>
              {selected?.tenant_id
                ? <div style={{fontSize:10,color:'#10b981',fontWeight:700}}>✓ Office created — agreements are managed from Offices → Documents</div>
                : <button onClick={()=>window.location.assign(`/crm-admin/provision?prospect_id=${selected.id}`)} style={{padding:'7px 11px',borderRadius:7,border:'none',background:'#10b981',color:'#052e16',fontSize:10,fontWeight:900,cursor:'pointer'}}>🏢 Create New Office from Sale</button>}
            </div>

"""
          if panel in s:
              s=s.replace(panel,cta,1)
          elif 'Create New Office from Sale' not in s:
              marker='            {/* Activity log */}'
              assert marker in s, 'Sales activity marker missing'
              s=s.replace(marker,cta+marker,1)
          p.write_text(s)

          # Office screen: sale can create office first; e-sign now lives inside office Documents.
          p=Path('src/pages/NewOffice.jsx')
          s=p.read_text()
          imp="import RomyLabsAgreementPanel from '../components/admin/RomyLabsAgreementPanel'\n"
          if imp not in s:
              anchor="import { useApp } from '../context/AppContext'\n"
              assert anchor in s, 'NewOffice import anchor missing'
              s=s.replace(anchor,anchor+imp,1)

          old="""  useEffect(() => {
    if (!allowed) return
    const prospectId=searchParams.get('prospect_id')
    const agreementId=searchParams.get('agreement_id')
    if (!prospectId || !agreementId) return
    ;(async()=>{
      const [{data:prospect,error:pe},{data:agreement,error:ae}] = await Promise.all([
        supabase.from('prospects').select('*').eq('id',prospectId).maybeSingle(),
        supabase.from('romylabs_sales_agreements').select('*').eq('id',agreementId).eq('prospect_id',prospectId).maybeSingle(),
      ])
      if (pe || ae || !prospect || !agreement) { showToast('❌ Could not load the signed sale'); return }
      if (agreement.status !== 'signed') { showToast('❌ Agreement must be signed before creating the office'); return }
      if (agreement.tenant_id) { showToast('This signed sale is already linked to an office'); return }
      setSaleHandoff({prospect,agreement})
      setView('form')
    })()
  }, [allowed, searchParams])
"""
          new="""  useEffect(() => {
    if (!allowed) return
    const prospectId=searchParams.get('prospect_id')
    const agreementId=searchParams.get('agreement_id')
    if (!prospectId) return
    ;(async()=>{
      const {data:prospect,error:pe}=await supabase.from('prospects').select('*').eq('id',prospectId).maybeSingle()
      if (pe || !prospect) { showToast('❌ Could not load the sale'); return }
      if (prospect.tenant_id) { showToast('This sale is already linked to an office'); return }
      let agreement=null
      if (agreementId) {
        const {data:a,error:ae}=await supabase.from('romylabs_sales_agreements').select('*').eq('id',agreementId).eq('prospect_id',prospectId).maybeSingle()
        if (ae) { showToast('❌ Could not load agreement'); return }
        agreement=a
      }
      setSaleHandoff({prospect,agreement})
      setView('form')
    })()
  }, [allowed, searchParams])
"""
          assert old in s, 'Sale handoff effect marker missing'
          s=s.replace(old,new,1)

          old="""    if (prefill?.agreement?.id && data?.tenant_id) {
      const {error:linkErr}=await supabase.rpc('admin_romylabs_attach_signed_agreement',{p_agreement_id:prefill.agreement.id,p_tenant_id:data.tenant_id})
      if (linkErr) showToast('⚠️ Office created, but agreement filing needs attention: ' + linkErr.message)
      else showToast('✅ Office created from signed sale — agreement filed to Documents')
    }
    setResult(data)
"""
          new="""    if (prefill?.prospect?.id && data?.tenant_id) {
      const {error:linkErr}=await supabase.rpc('admin_romylabs_link_prospect_office',{p_prospect_id:prefill.prospect.id,p_tenant_id:data.tenant_id})
      if (linkErr) showToast('⚠️ Office created, but sale linkage needs attention: ' + linkErr.message)
      else showToast('✅ Office created from sale — manage agreement from Office Documents')
    }
    if (prefill?.agreement?.id && prefill.agreement.status==='signed' && data?.tenant_id) {
      const {error:fileErr}=await supabase.rpc('admin_romylabs_attach_signed_agreement',{p_agreement_id:prefill.agreement.id,p_tenant_id:data.tenant_id})
      if (fileErr) showToast('⚠️ Office created, but signed agreement filing needs attention: ' + fileErr.message)
    }
    setResult(data)
"""
          assert old in s, 'NewOffice submit linkage marker missing'
          s=s.replace(old,new,1)

          old="""      {prefill&&<div style={{margin:'0 0 18px',padding:'12px 14px',borderRadius:9,background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.28)',color:'#a7f3d0',fontSize:12,lineHeight:1.6}}><strong>Signed sale handoff</strong><br/>{prefill.prospect?.firm_name} · {prefill.agreement?.seats||1} seats · ${Number(prefill.agreement?.monthly_amount||0).toLocaleString()}/mo · signed by {prefill.agreement?.signed_name||prefill.agreement?.signer_name||'customer'}. Creating this office will permanently link the signed agreement to the office Documents record.</div>}
"""
          new="""      {prefill&&<div style={{margin:'0 0 18px',padding:'12px 14px',borderRadius:9,background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.28)',color:'#a7f3d0',fontSize:12,lineHeight:1.6}}><strong>Sale → Office handoff</strong><br/>{prefill.prospect?.firm_name} · {prefill.prospect?.seats||prefill.agreement?.seats||1} seats · ${Number(prefill.prospect?.mrr_potential||prefill.agreement?.monthly_amount||0).toLocaleString()}/mo. Create the office first; then send and manage the agreement from that office's Documents area.</div>}
"""
          if old in s: s=s.replace(old,new,1)

          old="""  const [uploading, setUploading] = useState(false)
  const [confirmDeactivate, setConfirmDeactivate] = useState(false)
"""
          new="""  const [uploading, setUploading] = useState(false)
  const [officeProspect, setOfficeProspect] = useState(null)
  const [confirmDeactivate, setConfirmDeactivate] = useState(false)
"""
          assert old in s, 'OfficeDetail state marker missing'
          s=s.replace(old,new,1)

          old="""    setDetail(data)
    setEdit(null)
  }
"""
          new="""    setDetail(data)
    const {data:prospect,error:prospectError}=await supabase.rpc('admin_romylabs_prospect_for_tenant',{p_tenant_id:tenantId})
    if (prospectError) console.error('Could not load linked sales record:',prospectError)
    setOfficeProspect(prospect||null)
    setEdit(null)
  }
"""
          assert old in s, 'OfficeDetail load marker missing'
          s=s.replace(old,new,1)

          old="""      <Section title=\"Agreement Files\">
        <div style={{marginBottom:12}}>
          <label className=\"btn sec\" style={{cursor:'pointer',display:'inline-block'}}>
            {uploading ? 'Uploading…' : '📎 Upload Agreement'}
            <input type=\"file\" onChange={handleUpload} disabled={uploading} style={{display:'none'}}/>
          </label>
        </div>
        {detail.agreements.length === 0 ? <div style={{color:'var(--t3)',fontSize:13}}>No agreement files uploaded yet.</div> : (
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {detail.agreements.map(a => (
              <div key={a.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13,padding:'8px 10px',background:'var(--s2)',borderRadius:6}}>
                <div>
                  <span style={{color:'var(--tx)',fontWeight:600,cursor:'pointer',textDecoration:'underline'}} onClick={()=>viewAgreement(a.file_path)}>{a.file_name}</span>
                  <span style={{color:'var(--t3)',marginLeft:8}}>{fmtBytes(a.file_size)} · {new Date(a.created_at).toLocaleDateString()}</span>
                </div>
                <button className=\"btn sec\" style={{padding:'4px 10px',fontSize:12}} onClick={()=>deleteAgreement(a.id)}>Remove</button>
              </div>
            ))}
          </div>
        )}
      </Section>
"""
          new="""      <Section title=\"Documents & E-Sign\">
        {officeProspect ? (
          <div style={{margin:'-16px -16px 16px'}}>
            <RomyLabsAgreementPanel prospect={officeProspect} supabase={supabase} onChanged={load} />
          </div>
        ) : (
          <div style={{fontSize:12,color:'var(--t3)',marginBottom:14,lineHeight:1.5}}>No linked sales record for this office yet. Agreements created manually can still be uploaded below.</div>
        )}
        <div style={{marginBottom:12,paddingTop:12,borderTop:'1px solid var(--br)'}}>
          <label className=\"btn sec\" style={{cursor:'pointer',display:'inline-block'}}>
            {uploading ? 'Uploading…' : '📎 Upload Document / Agreement'}
            <input type=\"file\" onChange={handleUpload} disabled={uploading} style={{display:'none'}}/>
          </label>
        </div>
        {detail.agreements.length === 0 ? <div style={{color:'var(--t3)',fontSize:13}}>No office agreement documents yet.</div> : (
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {detail.agreements.map(a => (
              <div key={a.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13,padding:'8px 10px',background:'var(--s2)',borderRadius:6}}>
                <div>
                  <span style={{color:'var(--tx)',fontWeight:600,cursor:'pointer',textDecoration:'underline'}} onClick={()=>viewAgreement(a.file_path)}>{a.file_name}</span>
                  <span style={{color:'var(--t3)',marginLeft:8}}>{fmtBytes(a.file_size)} · {new Date(a.created_at).toLocaleDateString()}</span>
                </div>
                <button className=\"btn sec\" style={{padding:'4px 10px',fontSize:12}} onClick={()=>deleteAgreement(a.id)}>Remove</button>
              </div>
            ))}
          </div>
        )}
      </Section>
"""
          assert old in s, 'Agreement Files section marker missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit moved workflow
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/AdminPortal.jsx src/pages/NewOffice.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(agreements): manage e-sign from office documents'
          git push
