name: Move E-Sign To Office Documents
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260901_romylabs_office_first_agreement_flow.sql'
      - '.github/scripts/move_esign_to_office.py'
      - '.github/workflows/move-esign-to-office-documents.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch UI
        run: python .github/scripts/move_esign_to_office.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit changes
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/AdminPortal.jsx src/pages/NewOffice.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(agreements): manage e-sign from office documents'
          git push
