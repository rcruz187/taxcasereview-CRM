name: Restore Original Admin Calendar Once

on:
  push:
    paths:
      - '.github/workflows/restore-original-admin-calendar-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only the original AdminCalendar wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminPortal.jsx')
          s = p.read_text()
          imp = "import RomyLabsCalendar from '../components/admin/RomyLabsCalendar'\n"
          if imp not in s:
              raise SystemExit('Expected RomyLabsCalendar import not found; refusing broad change')
          s = s.replace(imp, '', 1)
          old = "function AdminCalendar(){\n  return <RomyLabsCalendar />\n}"
          new = """function AdminCalendar(){
  const [ready, setReady] = useState(false)

  useEffect(()=>{
    const prev = sessionStorage.getItem('admin_impersonation')
    sessionStorage.removeItem('admin_impersonation')
    // No override — current_tenant_id() resolves naturally from Romy's login (TCR)
    setReady(true)
    return ()=>{
      if (prev) sessionStorage.setItem('admin_impersonation', prev)
    }
  },[])
  if (!ready) return null
  // Wrap in a div with className=\"page-content\" so Calendar's useEffect
  // escape hatch can find it and set overflow:hidden + padding:0.
  // Pre-set those values so there's no flash before the effect runs.
  // key=\"taxrescrm\" forces a fresh mount so CalendarPage queries after the
  // tenant override is set — STABLE fn caching can otherwise return stale results.
  return (
    <div
      key=\"taxrescrm-calendar\"
      className=\"page-content\"
      style={{ position:'relative', overflow:'hidden', padding:0, height:'100%', flex:1 }}
    >
      <CalendarPage />
    </div>
  )
}"""
          if old not in s:
              raise SystemExit('Expected swapped AdminCalendar block not found; refusing broad change')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify exact rollback
        run: |
          ! grep -q "RomyLabsCalendar from '../components/admin/RomyLabsCalendar'" src/pages/AdminPortal.jsx
          grep -q '<CalendarPage />' src/pages/AdminPortal.jsx
          grep -q 'taxrescrm-calendar' src/pages/AdminPortal.jsx
      - name: Commit rollback and remove this one-time workflow
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git rm .github/workflows/restore-original-admin-calendar-once.yml
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(calendar): restore original Admin Portal calendar'
          git push
