name: Nashville Pages Setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nashville-pages.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Add domain and trigger deployment
        run: |
          CF_TOKEN="cfut_HydJSm4KRyzDnCcp58KXFRI30TZY6z3bXKSeSio7a5058b4b"
          ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Account: $ACCOUNT_ID"

          echo "Adding custom domain..."
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/nashville-tax-crm/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"nashville.taxrescrm.app"}' \
            | grep -o '"success":[^,}]*\|"name":"[^"]*"\|"message":"[^"]*"'

          echo "Triggering deployment..."
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/nashville-tax-crm/deployments" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            | grep -o '"success":[^,}]*\|"url":"[^"]*"\|"message":"[^"]*"'

          echo "Getting project URL..."
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/nashville-tax-crm" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"subdomain":"[^"]*"'
