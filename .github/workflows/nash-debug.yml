name: Nash Debug
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nash-debug.yml']

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Test insert
        run: |
          NAS="ydrvncdedgjtcprczwpu"
          NASH="489ace07-1a6b-4864-833a-4f8420568b40"

          echo "=== Direct insert test ==="
          curl -s -X POST "https://api.supabase.com/v1/projects/$NAS/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"INSERT INTO clients (id, name, status, autopay_enabled, tenant_id) VALUES ('api-test-001', 'API Test Client', 'Active', false, '$NASH') ON CONFLICT (id) DO NOTHING RETURNING id, name\"}"

          echo "=== Count check ==="
          curl -s -X POST "https://api.supabase.com/v1/projects/$NAS/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"SELECT COUNT(*) as cnt FROM clients WHERE tenant_id='$NASH'\"}"

          echo "=== Check what user the API runs as ==="
          curl -s -X POST "https://api.supabase.com/v1/projects/$NAS/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"SELECT current_user, session_user\"}"
