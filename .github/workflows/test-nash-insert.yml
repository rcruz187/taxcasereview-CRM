name: Test Nashville Insert
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Test insert and read
        run: |
          NAS="ydrvncdedgjtcprczwpu"
          NASH="489ace07-1a6b-4864-833a-4f8420568b40"

          q() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$NAS/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"$1\"}"
          }

          echo "=== RLS status ==="
          q "SELECT tablename, rowsecurity FROM pg_tables WHERE tablename='clients' AND schemaname='public'"

          echo "=== Policies ==="
          q "SELECT policyname, cmd, qual FROM pg_policies WHERE tablename='clients'"

          echo "=== Try insert bypassing RLS ==="
          q "SET LOCAL row_security = off; INSERT INTO clients (id, name, status, tenant_id) VALUES ('test-nash-001', 'Test Client', 'Active', '$NASH') ON CONFLICT DO NOTHING"

          echo "=== Count ==="
          q "SELECT COUNT(*) as cnt FROM clients"

          echo "=== Count without RLS ==="
          q "SET row_security = off; SELECT COUNT(*) as cnt FROM clients"
