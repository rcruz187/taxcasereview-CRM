name: Set Supabase Secret
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret name'
        required: true
      secret_value:
        description: 'Secret value'
        required: true
jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Set Supabase edge function secret
        run: |
          curl -s -X PATCH \
            "https://api.supabase.com/v1/projects/${{ env.PROJECT_REF }}/secrets" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "[{\"name\":\"${{ github.event.inputs.secret_name }}\",\"value\":\"${{ github.event.inputs.secret_value }}\"}]" \
            -w "\nHTTP:%{http_code}"
    env:
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
