name: Run Admin Overview Branding Fix

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fix-admin-overview-branding.cjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply branding patch
        run: node scripts/fix-admin-overview-branding.cjs
      - name: Verify branding and auth guard
        run: |
          grep -F '<img src="/romylabs-logo.png" alt="RomyLabs"' src/pages/AdminPortal.jsx
          grep -F "SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM" src/App.jsx
          grep -F "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -F "if (isPlatformOwner(user?.email)) return null" src/App.jsx
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "fix(admin): use RomyLabs branding on Overview" || true
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
