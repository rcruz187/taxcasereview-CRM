name: Apply Inline Fax Provider ID Fix

on:
  push:
    paths:
      - '.github/scripts/fix_inline_fax_provider_ids.py'
      - '.github/workflows/apply-inline-fax-provider-id-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix provider-aware fax log ids
        run: python .github/scripts/fix_inline_fax_provider_ids.py
      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'actions@github.com'
          git add src/pages/Leads.jsx src/pages/Clients.jsx
          git commit -m 'fix(fax): log provider ids into existing columns'
          git push origin HEAD:main
