name: Hotfix TaxRes Owner Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-taxres-owner-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch root owner routing
        run: python scripts/fix_taxres_owner_routing.py

      - name: Verify root-cause removal
        run: |
          grep -q "const isAdminHost = window.location.hostname.toLowerCase() === 'admin.romylabs.com'" src/App.jsx
          grep -q "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -q "window.location.hostname.toLowerCase() === 'admin.romylabs.com' ? (" src/App.jsx

      - name: Production build
        run: |
          npm ci
          npm run build

      - name: Commit and deploy source fix
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/App.jsx
          git commit -m 'fix(auth): scope admin routing to RomyLabs admin host'
          git push origin main
