name: Apply Arcvena Support Secret
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-arcvena-support-secret.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ARCVENA_SUPPORT_SECRET: ${{ secrets.ARCVENA_SUPPORT_SECRET }}
      CENTRAL_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Validate GitHub secret is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARCVENA_SUPPORT_SECRET"
          test "${#ARCVENA_SUPPORT_SECRET}" -eq 44
          echo GITHUB_ARCVENA_SECRET_PRESENT_LENGTH_44
      - name: Set central Supabase secret
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest secrets set "ARCVENA_SUPPORT_SECRET=$ARCVENA_SUPPORT_SECRET" --project-ref "$CENTRAL_REF"
          npx --yes supabase@latest secrets list --project-ref "$CENTRAL_REF" | grep -q 'ARCVENA_SUPPORT_SECRET'
          echo CENTRAL_ARCVENA_SECRET_SET
      - name: Redeploy support-api
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy support-api --project-ref "$CENTRAL_REF" --no-verify-jwt
          echo CENTRAL_SUPPORT_API_REDEPLOYED
