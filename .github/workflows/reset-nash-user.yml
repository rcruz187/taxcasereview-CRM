name: Reset Nashville Auth User
on:
  workflow_dispatch:
jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Update user password via Admin API
        run: |
          echo "Updating password for admin@nashvilletaxsolutions.com..."
          RESULT=$(curl -s -X PUT \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/auth/users/4f1f0d1a-eeec-41ef-9368-99a29cc83aee" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "password": "Nashville2026!",
              "email_confirm": true
            }')
          echo "Result: $RESULT"
          
      - name: Verify user state
        run: |
          curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/auth/users?page=1&per_page=100" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | \
            python3 -c "
import json,sys
data=json.load(sys.stdin)
users=data.get('users',[])
for u in users:
    if 'nashville' in u.get('email','').lower():
        print('Found user:')
        print(json.dumps({k:v for k,v in u.items() if k not in ['identities']}, indent=2))
"
