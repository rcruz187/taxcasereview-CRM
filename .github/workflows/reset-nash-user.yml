name: Reset Nashville Auth User
on:
  workflow_dispatch:
jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Delete existing user
        run: |
          curl -s -X DELETE \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/auth/users/4f1f0d1a-eeec-41ef-9368-99a29cc83aee" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json"
          echo "Delete done"
          sleep 2

      - name: Create new user
        run: |
          curl -s -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/auth/users" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "admin@nashvilletaxsolutions.com",
              "password": "Nashville2026!",
              "email_confirm": true,
              "user_metadata": {}
            }'
          echo "Create done"
