name: Fix LinkedIn Real Connection State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-linkedin-real-connection-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Remove stale Arcvena authorization special-case
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminPortal.jsx')
          s = p.read_text()
          old = '''            ) : selectedPid === 'arcvena' ? (\n              <div style={{ ...CC2.card, padding:'12px', marginBottom:10 }}>\n                <div style={{ fontSize:11, color:'#f59e0b', fontWeight:700, marginBottom:4 }}>\n                  🔐 LinkedIn Page: Authorization Pending\n                </div>\n                <div style={{ fontSize:10, color:'#64748b' }}>\n                  Arcvena LinkedIn Company Page publishing is pending LinkedIn API approval.\n                  Connection will be available once approved.\n                </div>\n              </div>\n            ) : ('''
          new = '''            ) : ('''
          if old not in s:
              raise SystemExit('Expected stale Arcvena LinkedIn block not found; refusing blind patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify real-state UI
        run: |
          ! grep -q "LinkedIn Page: Authorization Pending" src/pages/AdminPortal.jsx
          ! grep -q "Arcvena LinkedIn Company Page publishing is pending" src/pages/AdminPortal.jsx
          grep -q "Connect LinkedIn to publish posts" src/pages/AdminPortal.jsx
          grep -q "button onClick={connectLinkedIn}" src/pages/AdminPortal.jsx
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx
          git diff --cached --quiet || git commit -m 'fix(linkedin): use live connection state for Arcvena'
          git push origin HEAD:main
