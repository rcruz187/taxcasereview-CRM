name: RomyLabs Training Host Console Build
on:
  push:
    branches: [feature/romylabs-training-host-console]
    paths:
      - '.github/workflows/romylabs-training-console-build.yml'
      - 'src/pages/LargeTrainingRoom.jsx'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vite build
