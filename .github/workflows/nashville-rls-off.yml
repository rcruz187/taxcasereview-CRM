name: Nashville RLS Toggle
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'disable or enable'
        required: true
        default: 'disable'

jobs:
  toggle:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Toggle RLS
        run: |
          NAS="ydrvncdedgjtcprczwpu"
          ACTION="${{ github.event.inputs.action }}"

          run_sql() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$NAS/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"$1\"}"
          }

          TABLES="clients cases employees leads tasks calevents payments payment_transactions client_notes lead_notes invoices documents esigns sms_messages fax_logs workflow_templates workflow_statuses workflow_status_categories deadlines poa_records transcript_analyses timeentries payrollruns billing_time_entries billing_activity_types calllog call_logs"

          for T in $TABLES; do
            if [ "$ACTION" = "disable" ]; then
              run_sql "ALTER TABLE $T DISABLE ROW LEVEL SECURITY" > /dev/null
              echo "RLS disabled: $T"
            else
              run_sql "ALTER TABLE $T ENABLE ROW LEVEL SECURITY" > /dev/null
              echo "RLS enabled: $T"
            fi
          done
          echo "Done"
