name: Nashville Setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nashville-setup.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check project and trigger deployment
        run: |
          CF_TOKEN="cfut_ycmXEArcGSBXDwOiQgzwIA8PHD2947E36DHoZdPHd668e199"

          ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          echo "Account: $ACCOUNT_ID"

          # Get project details
          PROJECT=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/nashville-tax-crm" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "Project response:"
          echo "$PROJECT" | grep -o '"name":"[^"]*"\|"subdomain":"[^"]*"\|"success":[^,}]*\|"message":"[^"]*"'

          # Try adding domain anyway
          echo "Adding domain..."
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/nashville-tax-crm/domains" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name": "nashville.taxrescrm.app"}' \
            | grep -o '"success":[^,}]*\|"message":"[^"]*"\|"name":"[^"]*"'
