name: Nashville Setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nashville-setup.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check Nashville project state
        run: |
          CF_TOKEN="cfut_ycmXEArcGSBXDwOiQgzwIA8PHD2947E36DHoZdPHd668e199"

          ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          echo "=== All Pages Projects ==="
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"name":"[^"]*"\|"subdomain":"[^"]*"\|"deployment_trigger":[^}]*'
