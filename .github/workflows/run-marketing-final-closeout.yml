name: Run Marketing Final Closeout

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fix-marketing-final-closeout.cjs'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Marketing patch
        run: node scripts/fix-marketing-final-closeout.cjs
      - name: Verify Marketing and admin auth guards
        run: |
          grep -F "const reportingDate = (traffic || []).reduce" src/pages/AdminPortal.jsx
          grep -F "marketingConnectedProducts={ga4LiveProducts}" src/pages/AdminPortal.jsx
          grep -F "[tab, marketingProduct, ga4EnabledProducts]" src/pages/AdminPortal.jsx
          grep -F "SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM" src/App.jsx
          grep -F "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -F "if (isPlatformOwner(user?.email)) return null" src/App.jsx
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source patch
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "fix(marketing): use product GA4 reporting date and live status" || true
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
