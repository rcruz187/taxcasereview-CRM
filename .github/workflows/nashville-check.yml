name: Nashville Check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nashville-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List all projects and test URLs
        run: |
          CF_TOKEN="cfut_ycmXEArcGSBXDwOiQgzwIA8PHD2947E36DHoZdPHd668e199"

          ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          echo "Account: $ACCOUNT_ID"

          echo "=== All Projects ==="
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"name":"[^"]*"\|"subdomain":"[^"]*"'

          echo "=== Test nashville-tax-crm.pages.dev ==="
          curl -s -o /dev/null -w "HTTP: %{http_code}" "https://nashville-tax-crm.pages.dev" || echo "unreachable"

          echo ""
          echo "=== Test nashville-tax-crm pages.dev ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://nashville-tax-crm.pages.dev/")
          echo "Status: $STATUS"
