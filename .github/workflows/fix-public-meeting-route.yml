name: Fix Public Meeting Route

on:
  push:
    branches: [fix/public-meeting-route]
    paths: ['.github/workflows/fix-public-meeting-route.yml']

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-meeting-route
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Hard-bypass admin routing for public meeting pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = """function AuthRouter() {\n  const { user, checking } = useApp()\n  const path = window.location.pathname\n\n  // Public routes must render immediately — never block them on the auth check."""
          new = """function AuthRouter() {\n  const { user, checking } = useApp()\n  const path = window.location.pathname\n\n  // HARD PUBLIC BOUNDARY: meeting tabs on admin.romylabs.com must never enter\n  // AdminGate/RequireAuth. Render the meeting room immediately from the URL,\n  // regardless of the owner's existing admin session.\n  if (/^\\/meet\\/[^/]+/.test(path)) {\n    return (\n      <Suspense fallback={<div style={{minHeight:'100vh',background:'#080b14'}} />}>\n        <MeetingRoom />\n      </Suspense>\n    )\n  }\n\n  // Public routes must render immediately — never block them on the auth check."""
          if old not in s:
              raise SystemExit('AuthRouter insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - name: Commit routing fix
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/App.jsx
          git commit -m "fix: keep public meeting tabs out of admin routing"
          git push origin HEAD:fix/public-meeting-route
