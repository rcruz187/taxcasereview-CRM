name: Fix Registry Product Selectors
'on':
  push:
    branches: [main]
    paths: [.github/workflows/fix-registry-product-selectors.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminPortal.jsx'); s=p.read_text()
          a="supabase.from('romylabs_products').select('product_id,name,active')"
          b="supabase.from('romylabs_products').select('product_id,name,active,lifecycle,public')"
          c="const active = (data || []).filter(p => p.active)"
          d="const active = (data || []).filter(p => p.active && p.product_id !== 'phl' && !/^PHL(?:\\s|$)/i.test(p.name || '') && String(p.lifecycle || '').toLowerCase() !== 'internal')"
          if a not in s or c not in s: raise SystemExit('targets missing')
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
      - name: Build and verify
        shell: bash
        run: |
          npm ci
          npm run build
          grep -Fq "product_id,name,active,lifecycle,public" src/pages/AdminPortal.jsx
          grep -Fq "p.product_id !== 'phl'" src/pages/AdminPortal.jsx
          grep -Fq "String(p.lifecycle || '').toLowerCase() !== 'internal'" src/pages/AdminPortal.jsx
          if grep -Fq "PHL Land Care CRM" src/pages/AdminPortal.jsx; then exit 1; fi
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'RomyLabs Fix Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): make product selectors registry-driven'
          git restore .
          git pull --rebase origin main
          git push origin HEAD:main
