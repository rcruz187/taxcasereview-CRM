name: Sandbox Live LinkedIn OAuth Fingerprint 2

on:
  push:
    branches:
      - sandbox/live-linkedin-oauth-fingerprint-2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live admin bundle
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://admin.romylabs.com/?oauth_probe=2')"
          asset="$(printf '%s' "$html" | grep -oE 'src="/assets/index-[^"]+\.js"' | head -1 | cut -d'"' -f2)"
          echo "LIVE_ASSET=$asset"
          js="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://admin.romylabs.com$asset?oauth_probe=2")"
          guard="$(printf '%s' "$js" | grep -oE 'assets/AdminPortalGuard-[A-Za-z0-9_-]+\.js' | head -1 || true)"
          echo "LIVE_ADMIN_GUARD=$guard"
          test -n "$guard" || exit 2
          portal="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://admin.romylabs.com/$guard?oauth_probe=3")"
          printf '%s' "$portal" | grep -Fq 'https://taxrescrm.app/crm-admin/linkedin/callback' && echo LIVE_TRUSTED_REDIRECT=1 || echo LIVE_TRUSTED_REDIRECT=0
          printf '%s' "$portal" | grep -Fq 'https://admin.romylabs.com/crm-admin/linkedin/callback' && echo LIVE_ADMIN_REDIRECT=1 || echo LIVE_ADMIN_REDIRECT=0
          printf '%s' "$portal" | grep -Fq 'w_organization_social' && echo LIVE_ORG_SCOPE=1 || echo LIVE_ORG_SCOPE=0
          if printf '%s' "$portal" | grep -Fq 'https://taxrescrm.app/crm-admin/linkedin/callback'; then
            echo LIVE_ADMINPORTAL_CALLBACK_GREEN
          else
            exit 3
          fi
