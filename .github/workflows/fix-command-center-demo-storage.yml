name: Fix Command Center Demo Storage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-command-center-demo-storage.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply targeted production SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/q.json
          import json,pathlib
          sql=pathlib.Path('supabase/migrations/20260828125500_command_center_taxres_demo_storage_fix.sql').read_text()
          print(json.dumps({'query':sql}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/q.json
      - name: Patch Command Center source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminPortal.jsx')
          s=p.read_text()
          old="""        const [statsRes, tenantsRes, storageRes] = await Promise.all([\n          withTimeout(supabase.rpc('admin_command_center_stats'), 'admin_command_center_stats'),\n          withTimeout(supabase.rpc('admin_tenant_overview'), 'admin_tenant_overview'),\n          withTimeout(supabase.rpc('admin_storage_stats'), 'admin_storage_stats'),\n        ])"""
          new="""        const [statsRes, tenantsRes, storageRes, taxresDemoRes] = await Promise.all([\n          withTimeout(supabase.rpc('admin_command_center_stats'), 'admin_command_center_stats'),\n          withTimeout(supabase.rpc('admin_tenant_overview'), 'admin_tenant_overview'),\n          withTimeout(supabase.rpc('admin_storage_stats'), 'admin_storage_stats'),\n          withTimeout(supabase.rpc('admin_taxres_demo_stats'), 'admin_taxres_demo_stats'),\n        ])"""
          if old not in s: raise SystemExit('Promise.all target not found')
          s=s.replace(old,new,1)
          old2="""        if (statsRes.error) throw new Error('RPC error: ' + JSON.stringify(statsRes.error))\n        if (!stats || stats.error) throw new Error('Stats unavailable: ' + JSON.stringify(stats))"""
          new2="""        if (statsRes.error) throw new Error('RPC error: ' + JSON.stringify(statsRes.error))\n        if (storageRes.error) throw new Error('Storage RPC error: ' + JSON.stringify(storageRes.error))\n        if (taxresDemoRes.error) throw new Error('TaxRes demo RPC error: ' + JSON.stringify(taxresDemoRes.error))\n        if (!stats || stats.error) throw new Error('Stats unavailable: ' + JSON.stringify(stats))"""
          if old2 not in s: raise SystemExit('error handling target not found')
          s=s.replace(old2,new2,1)
          old3="""          todayDemos:    Number(stats.today_demos||0),"""
          new3="""          todayDemos:    Number(taxresDemoRes?.data?.today_count || 0),"""
          if old3 not in s: raise SystemExit('today demos target not found')
          s=s.replace(old3,new3,1)
          old4="""        upcomingDemos:(stats.today_schedule||[]).filter(e=>new Date(e.start)>new Date()).slice(0,5),"""
          new4="""        upcomingDemos:(taxresDemoRes?.data?.upcoming || []).slice(0,5),"""
          if old4 not in s: raise SystemExit('upcoming demos target not found')
          s=s.replace(old4,new4,1)
          old5="""? <div style={{ fontSize:13, color:'#475569' }}>No demos scheduled — all product bookings appear here.</div>"""
          new5="""? <div style={{ fontSize:13, color:'#475569' }}>No TaxRes demos scheduled.</div>"""
          if old5 not in s: raise SystemExit('empty-state target not found')
          s=s.replace(old5,new5,1)
          p.write_text(s)
          PY
      - name: Build and source checks
        run: |
          npm ci
          npm run build
          grep -q "admin_taxres_demo_stats" src/pages/AdminPortal.jsx
          grep -q "Storage RPC error" src/pages/AdminPortal.jsx
          ! grep -q "all product bookings appear here" src/pages/AdminPortal.jsx
      - name: Live DB acceptance check
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/q.json
          import json
          q=r'''
          begin;
          select set_config('request.jwt.claim.email','info@romylabs.com',true);
          select set_config('request.jwt.claim.role','authenticated',true);
          select public.admin_storage_stats() as storage;
          select public.admin_taxres_demo_stats() as demos;
          rollback;
          '''
          print(json.dumps({'query':q}))
          PY
          OUT=$(curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/q.json)
          echo "$OUT"
          echo "$OUT" | grep -q '18718717'
          echo "$OUT" | grep -q '161'
          echo "$OUT" | grep -q 'taxres_crm'
      - name: Commit source fix
        run: |
          git config user.name 'RomyLabs Fix Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx
          git diff --cached --quiet || git commit -m 'fix(admin): scope TaxRes demos and surface storage failures'
          git push origin HEAD:main
