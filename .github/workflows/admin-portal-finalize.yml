name: Admin Portal Finalize
on:
  push:
    branches: [main]
    paths:
      - 'scripts/admin-portal-finalize.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply deterministic source wiring
        run: node scripts/admin-portal-finalize.cjs
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Verify every admin sidebar route and critical wiring
        run: |
          grep -q "AdminPortalGuard" src/App.jsx
          grep -q "RomyLabsBilling" src/pages/AdminPortal.jsx
          grep -q 'path="/command-center"' src/pages/AdminPortal.jsx
          grep -q 'path="/offices"' src/pages/AdminPortal.jsx
          grep -q 'path="/provision"' src/pages/AdminPortal.jsx
          grep -q 'path="/billing"' src/pages/AdminPortal.jsx
          grep -q 'path="/demo"' src/pages/AdminPortal.jsx
          grep -q 'path="/employees"' src/pages/AdminPortal.jsx
          grep -q 'path="/support"' src/pages/AdminPortal.jsx
          grep -q 'path="/audit"' src/pages/AdminPortal.jsx
          grep -q 'path="/email"' src/pages/AdminPortal.jsx
          grep -q 'path="/calendar"' src/pages/AdminPortal.jsx
          grep -q 'path="/chat"' src/pages/AdminPortal.jsx
          grep -q "const \[crmAccount, setCrmAccount\] = useState('all')" src/pages/AdminPortal.jsx
          ! grep -q "removeResolvedAlert" public/romylabs-admin-hotfix.js
      - name: Commit verified source
        run: |
          git config user.name "RomyLabs Repair Bot"
          git config user.email "rcruz187@gmail.com"
          git add src/App.jsx src/pages/AdminPortal.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): wire owner guard and SaaS billing"
          git push origin HEAD:main
