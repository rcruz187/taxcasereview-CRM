name: Tax Case TaxRes EN ES standardization one-time runner
on:
  push:
    paths:
      - .github/TAXRES_I18N_STANDARDIZE
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply TaxRes-wide EN ES standard
        run: python .github/scripts/standardize_taxres_i18n.py
      - name: Commit patch locally
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/lib/i18n.js
          git commit -m 'feat(i18n): enforce full TaxRes EN ES runtime translation'
      - name: Verify production build
        run: |
          npm ci
          npm run build
      - name: Push verified patch
        run: git push origin HEAD:main
