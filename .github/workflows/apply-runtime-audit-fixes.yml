name: Apply Runtime Audit Fixes

on:
  push:
    paths:
      - '.github/scripts/fix_runtime_context_and_invoice_payment.py'
      - '.github/workflows/apply-runtime-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited fixes
        run: python .github/scripts/fix_runtime_context_and_invoice_payment.py
      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'actions@github.com'
          git add src/pages/Payments.jsx src/pages/Invoices.jsx src/pages/Calendar.jsx src/pages/TaxReturns.jsx
          git commit -m 'fix(audit): repair runtime actor context and invoice payments'
          git push origin HEAD:main
