name: Finish Arcvena Camvella Marketing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-arcvena-camvella-marketing.yml'

permissions:
  contents: write

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch Marketing GA4 registry capability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminPortal.jsx')
          s = p.read_text()
          state_anchor = "  const [reportingProducts, setReportingProducts] = React.useState([])\n"
          state_line = "  const [ga4EnabledProducts, setGa4EnabledProducts] = React.useState([])\n"
          if state_line not in s:
              if state_anchor not in s:
                  raise SystemExit('state anchor missing')
              s = s.replace(state_anchor, state_anchor + state_line, 1)
          marker = "  // ── Reporting registry — dynamic product list from romylabs_products ──\n"
          effect = "  React.useEffect(() => {\n    supabase.from('product_traffic_channels').select('product_id,status,tracking_id').eq('channel_key','ga4').then(({ data, error }) => {\n      if (error) { setGa4EnabledProducts([]); return }\n      setGa4EnabledProducts((data || []).filter(r => r.tracking_id && ['configured','live'].includes(r.status)).map(r => r.product_id))\n    })\n  }, [])\n\n"
          if effect not in s:
              if marker not in s:
                  raise SystemExit('reporting marker missing')
              s = s.replace(marker, marker + effect, 1)
          s = s.replace("if (tab==='marketing' && ['taxres_crm','romylabs'].includes(marketingProduct)) loadGA4()", "if (tab==='marketing' && ga4EnabledProducts.includes(marketingProduct)) loadGA4()", 1)
          s = s.replace("{['taxres_crm','romylabs'].includes(marketingProduct) ? <>", "{ga4EnabledProducts.includes(marketingProduct) ? <>", 1)
          p.write_text(s)
          PY
      - name: Verify Marketing and admin auth gate
        run: |
          grep -F "ga4EnabledProducts" src/pages/AdminPortal.jsx
          grep -F "product_traffic_channels" src/pages/AdminPortal.jsx
          grep -F "invoke('ga4-sync', { body: { product_id: marketingProduct } })" src/pages/AdminPortal.jsx
          grep -F "SECURITY BOUNDARY: admin.romylabs.com must never render a tenant/demo CRM" src/App.jsx
          grep -F "if (!isAdminHost) return <Shell />" src/App.jsx
          grep -F "if (isPlatformOwner(user?.email)) return null" src/App.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source fix
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "fix(marketing): derive GA4 products from traffic registry" || true
          git push
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
