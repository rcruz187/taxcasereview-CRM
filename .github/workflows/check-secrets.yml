name: Test Send Email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test serve-app edge function
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/')
          PREVIEW=$(head -c 500 /tmp/body.txt | tr -d '\000-\010\013\014\016-\037')
          echo "HTTP: $HTTP"
          echo "Preview: $PREVIEW"
          gh issue create \
            --repo taxresolutioncrm/taxcasereview-CRM \
            --title "serve-app-test-result" \
            --body "HTTP: ${HTTP} | Preview: ${PREVIEW}"
