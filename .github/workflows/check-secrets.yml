name: Test Send Email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test serve-app JS asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Test the HTML page
          HTML_HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/')
          
          # Test the JS asset content-type
          JS_HEADERS=$(curl -sI \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/assets/index-Dtmn5plU.js')
          
          # Test the CSS asset
          CSS_HEADERS=$(curl -sI \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/assets/index-DVq7vtti.css')
          
          gh issue create \
            --repo taxresolutioncrm/taxcasereview-CRM \
            --title "asset-test-$(date +%s)" \
            --body "HTML: ${HTML_HTTP} | JS Headers: ${JS_HEADERS} | CSS Headers: ${CSS_HEADERS}"
