name: Test Send Email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test serve-app assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JS_HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/assets/index-Dtmn5plU.js')
          JS_TYPE=$(curl -sI \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/assets/index-Dtmn5plU.js' | grep content-type)
          CSS_HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/assets/index-DVq7vtti.css')
          gh issue create \
            --repo taxresolutioncrm/taxcasereview-CRM \
            --title "asset-check-$(date +%s)" \
            --body "JS: ${JS_HTTP} type: ${JS_TYPE} | CSS: ${CSS_HTTP}"
