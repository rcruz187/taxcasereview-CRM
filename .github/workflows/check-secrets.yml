name: Test Send Email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test serve-app JS asset body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the actual body of the JS 404 to see debug path info
          JS_BODY=$(curl -s \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/assets/index-Dtmn5plU.js' | head -c 500)
          
          gh issue create \
            --repo taxresolutioncrm/taxcasereview-CRM \
            --title "debug-path-$(date +%s)" \
            --body "JS_BODY: ${JS_BODY}"
