name: Test Send Email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get JS 404 debug body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JS_BODY=$(curl -s \
            'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/assets/index-Dtmn5plU.js' | head -c 300)
          gh issue create \
            --repo taxresolutioncrm/taxcasereview-CRM \
            --title "js-debug-$(date +%s)" \
            --body "JS_BODY: ${JS_BODY}"
