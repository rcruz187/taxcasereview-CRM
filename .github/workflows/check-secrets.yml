name: Set Secret and Test Email
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: Set BREVO_API_KEY in Supabase
        run: |
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "[{\"name\":\"BREVO_API_KEY\",\"value\":\"${{ secrets.BREVO_API_KEY_VAL }}\"}]")
          echo "Set secret HTTP: $HTTP"
          cat /tmp/r.json
      - name: Redeploy send-email
        run: |
          HTTP=$(curl -s -o /tmp/d.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/send-email/deploy" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}")
          echo "Deploy HTTP: $HTTP"
      - name: Test send-email
        run: |
          sleep 10
          RESP=$(curl -s -X POST \
            "https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/send-email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1weGd4ZnFkYnF1emtydnZlamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTk5MzksImV4cCI6MjA5NDg3NTkzOX0.puvhU1MV5nGOykizeTkwCpRR7NKKaGsVpA8oqjVjmu4" \
            -d '{"to":"rcruz187@gmail.com","subject":"Test Brevo HTTP API","html":"<p>If you get this, email is working.</p>","tenant_id":"a0000000-0000-0000-0000-000000000001"}')
          echo "Email response: $RESP"
          gh issue create --repo taxresolutioncrm/taxcasereview-CRM \
            --title "email-test-result" \
            --body "$RESP"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
