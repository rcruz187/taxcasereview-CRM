name: Test Send Email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub Support email
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESP=$(curl -s -X POST \
            "https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/send-email" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1weGd4ZnFkYnF1emtydnZlamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTk5MzksImV4cCI6MjA5NDg3NTkzOX0.puvhU1MV5nGOykizeTkwCpRR7NKKaGsVpA8oqjVjmu4" \
            -d '{
              "to": "support@github.com",
              "subject": "GitHub Pages host_not_allowed - Account: taxresolutioncrm - Urgent",
              "html": "<p>Hello GitHub Support,</p><p>Our GitHub Pages site has been returning host_not_allowed for all repositories under the account <strong>taxresolutioncrm</strong> since August 9, 2026 at approximately 05:00 UTC.</p><p><strong>Account:</strong> taxresolutioncrm<br><strong>Plan:</strong> GitHub Pro<br><strong>Affected repos:</strong> taxcasereview-CRM, taxcasereview-deploy, crm-frontend, taxresolutioncrm.github.io<br><strong>Custom domain:</strong> taxrescrm.app<br><strong>Error:</strong> HTTP 403 x-deny-reason: host_not_allowed on ALL repos including github.io subdomain</p><p>The issue began after a repository visibility was briefly changed from public to private and back to public. The Pages CDN appears to have flagged the entire account. Brand new public repos also return host_not_allowed immediately after Pages is enabled.</p><p>This is a production CRM serving active tax resolution clients. The site has been down 15+ hours. We urgently need the account-level Pages CDN block cleared.</p><p>Thank you,<br>Romy Cruz<br>romy@taxcasereview.org</p>",
              "tenant_id": "61a89aef-0e7e-4ea2-b222-44ab2024655a"
            }')
          echo "RESPONSE: $RESP"
          gh issue create \
            --repo taxresolutioncrm/taxcasereview-CRM \
            --title "github-support-email-result" \
            --body "$RESP"
