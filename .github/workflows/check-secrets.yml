name: Set Brevo Secret Safe
on:
  workflow_dispatch:
jobs:
  set:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - name: POST BREVO_API_KEY to Supabase edge function secrets
        run: |
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "[{\"name\":\"BREVO_API_KEY\",\"value\":\"${{ secrets.BREVO_API_KEY_VAL }}\"}]")
          echo "HTTP $HTTP"
          cat /tmp/r.json
