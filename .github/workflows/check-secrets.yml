name: Test Send Email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check root content-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEADERS=$(curl -sI 'https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/serve-app/')
          gh issue create \
            --repo taxresolutioncrm/taxcasereview-CRM \
            --title "ct-check-$(date +%s)" \
            --body "${HEADERS}"
