name: Apply Admin Product Usage Labels

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix-admin-product-usage-labels.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply dashboard patch
        run: node scripts/fix-admin-product-usage-labels.cjs
      - name: Commit patch
        run: |
          if git diff --quiet -- src/pages/AdminPortal.jsx; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): separate product usage from marketing'
          git push
