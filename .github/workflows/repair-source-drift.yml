name: Materialize Prebuild Source Repairs

on:
  push:
    branches: [audit/prebuild-source-drift]
    paths:
      - '.github/workflows/repair-source-drift.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/prebuild-source-drift
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply all existing deterministic source repair scripts
        shell: bash
        run: |
          set -euo pipefail
          npm run check-polling
          npm run manual:style
          npm run storage:fix-display
          npm run email:state-sync
          npm run email:count-sync
          npm run sidebar:badge-rpc
          npm run dashboard:glow
          npm run forms:state-esign-prefill
          npm run forms:irs-current
          npm run reports:accuracy
          npm run accounting:oauth-state
          npm run admin:metrics-proxy
          npm run admin:product-usage-labels
          npm run cases:modal-scope
          npm run ui:quick-create
          npm run ui:navigation-audit
      - name: Remove one-time repair workflow and commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-source-drift.yml
          git config user.name 'RomyLabs Audit Repair'
          git config user.email 'actions@github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No source drift to materialize'
            exit 0
          fi
          git commit -m 'fix: materialize prebuild source repairs'
          git push origin HEAD:audit/prebuild-source-drift
