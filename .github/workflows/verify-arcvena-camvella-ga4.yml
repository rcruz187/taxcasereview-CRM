name: Verify Arcvena Camvella GA4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-arcvena-camvella-ga4.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Live GA4 diagnostic
        shell: bash
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "RESULT=ANON_SECRET_NOT_CONFIGURED"
            exit 0
          fi
          for PRODUCT in camvella arcvena; do
            BODY=$(curl -sS -X POST "https://mpxgxfqdbquzkrvvejkh.supabase.co/functions/v1/ga4-sync" \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "apikey: $ANON_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"product_id\":\"$PRODUCT\"}" || true)
            echo "${PRODUCT^^}_RESULT=${BODY:0:1400}"
          done
