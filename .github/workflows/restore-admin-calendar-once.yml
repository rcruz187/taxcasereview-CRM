name: Restore Original Admin Calendar Once

on:
  push:
    paths:
      - '.github/workflows/restore-admin-calendar-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original AdminCalendar implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminPortal.jsx')
          s = p.read_text()
          s = s.replace("import RomyLabsCalendar from '../components/admin/RomyLabsCalendar'\n", "")
          new = """function AdminCalendar(){\n  return <RomyLabsCalendar />\n}\n"""
          old = """function AdminCalendar(){\n  const [ready, setReady] = useState(false)\n\n  useEffect(()=>{\n    const prev = sessionStorage.getItem('admin_impersonation')\n    sessionStorage.removeItem('admin_impersonation')\n    // No override — current_tenant_id() resolves naturally from Romy's login (TCR)\n    setReady(true)\n    return ()=>{\n      if (prev) sessionStorage.setItem('admin_impersonation', prev)\n    }\n  },[])\n  if (!ready) return null\n  // Wrap in a div with className=\"page-content\" so Calendar's useEffect\n  // escape hatch can find it and set overflow:hidden + padding:0.\n  // Pre-set those values so there's no flash before the effect runs.\n  // key=\"taxrescrm\" forces a fresh mount so CalendarPage queries after the\n  // tenant override is set — STABLE fn caching can otherwise return stale results.\n  return (\n    <div\n      key=\"taxrescrm-calendar\"\n      className=\"page-content\"\n      style={{ position:'relative', overflow:'hidden', padding:0, height:'100%', flex:1 }}\n    >\n      <CalendarPage />\n    </div>\n  )\n}\n"""
          if new in s:
              s = s.replace(new, old, 1)
          elif old not in s:
              raise SystemExit('AdminCalendar is neither the changed nor original implementation; refusing to touch unrelated code')
          p.write_text(s)
          assert "RomyLabsCalendar" not in s
          assert "<CalendarPage />" in s
          PY
      - name: Remove unintended replacement calendar component
        run: rm -f src/components/admin/RomyLabsCalendar.jsx
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit exact restoration
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'actions@github.com'
          git rm -f .github/workflows/restore-admin-calendar-once.yml
          git add src/pages/AdminPortal.jsx src/components/admin/RomyLabsCalendar.jsx || true
          git commit -m 'fix(admin): restore original calendar UI and remove replacement'
          git push
