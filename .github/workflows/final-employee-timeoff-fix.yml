name: Final employee time-off fix
on:
  push:
    paths:
      - '.github/workflows/final-employee-timeoff-fix.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch Employee Portal notification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/EmployeePortal.jsx')
          s=p.read_text()
          pattern=r"  // Best-effort notification to Super Admin/Admin users.*?\n  async function handleSubmitRequest\(\) \{"
          replacement="""  // Best-effort server-bound notification. The browser supplies only the\n  // employee session and request facts; send-email re-validates the session,\n  // matches the saved pending request, and derives admin recipients server-side.\n  async function notifyTimeOffSubmitted(token, type, start, end, days) {\n    try {\n      await supabase.functions.invoke('send-email', {\n        body: {\n          kind: 'employee_timeoff_notification',\n          employee_portal_token: token,\n          request_type: type, start_date: start, end_date: end, days,\n        },\n      })\n    } catch {\n      // Never let a notification failure block the employee's saved request.\n    }\n  }\n\n  async function handleSubmitRequest() {"""
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'expected one notification block, replaced {n}')
          old="notifyTimeOffSubmitted(data?.admin_emails, data?.tenant_id, emp, reqType, reqStart, reqEnd, days)"
          new="notifyTimeOffSubmitted(empToken, reqType, reqStart, reqEnd, days)"
          if old not in ns:
              raise SystemExit('old notification call not found')
          ns=ns.replace(old,new,1)
          p.write_text(ns)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/final-employee-timeoff-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'fix(employee-portal): secure time-off notifications'
          git push origin HEAD:main