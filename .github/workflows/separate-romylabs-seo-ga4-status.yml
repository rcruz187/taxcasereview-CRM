name: Separate RomyLabs SEO and GA4 Status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separate-romylabs-seo-ga4-status.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Apply isolated status patch
        run: node scripts/separate_romylabs_seo_ga4_status.cjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify isolation
        run: |
          grep -q "corporateReporting = \['seo','marketing'\]" src/pages/AdminPortal.jsx
          ! grep -q 'SEO implemented · GA4 reporting pending' src/pages/AdminPortal.jsx
          grep -q "marketing: 'implemented'" src/pages/AdminPortal.jsx
          git diff --check
      - name: Commit integration
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx
          git diff --cached --quiet || git commit -m 'fix(reporting): separate RomyLabs SEO and GA4 status'
          git push origin HEAD:main
