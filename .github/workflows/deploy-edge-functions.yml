name: Deploy Supabase Edge Functions

# Deploys edge functions to Supabase whenever function code or config changes
# on main. Also runnable on demand from the Actions tab (workflow_dispatch),
# with an optional single-function input for targeted redeploys.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Single function slug to deploy (blank = deploy all)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          set -euo pipefail
          # JWT settings come from supabase/config.toml (the source of truth),
          # so a plain `functions deploy` respects each function's verify_jwt.
          if [ -n "${{ github.event.inputs.function }}" ]; then
            echo "Deploying single function: ${{ github.event.inputs.function }}"
            supabase functions deploy "${{ github.event.inputs.function }}" \
              --project-ref "$PROJECT_REF"
          else
            echo "Deploying all edge functions"
            supabase functions deploy --project-ref "$PROJECT_REF"
          fi
