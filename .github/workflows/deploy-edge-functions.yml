name: Deploy Supabase Edge Functions

# Deploys edge functions to Supabase whenever function code or config changes
# on main. Also runnable on demand from the Actions tab (workflow_dispatch),
# with an optional single-function input for targeted redeploys.
# Manual dispatch only. A push trigger would auto-run a deploy on any function
# change, and a blank/all deploy resets server-side verify_jwt settings not in
# config.toml. Deploys are now deliberate and scoped to one named function.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/hub-proxy/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Function slug to deploy (or ALL_INTENTIONAL for a full redeploy)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          set -euo pipefail
          # JWT settings come from supabase/config.toml (the source of truth),
          # so a plain `functions deploy` respects each function's verify_jwt.
          if [ "${{ github.event_name }}" = "push" ]; then
            FN="hub-proxy"
          else
            FN="${{ github.event.inputs.function }}"
          fi
          if [ -z "$FN" ]; then
            echo "::error::No function specified. Blanket deploys are disabled on"
            echo "::error::purpose — they reset server-side settings (verify_jwt) not"
            echo "::error::captured in config.toml. Dispatch with a single function slug,"
            echo "::error::or use 'ALL_INTENTIONAL' only when a full redeploy is truly meant."
            exit 1
          fi
          if [ "$FN" = "ALL_INTENTIONAL" ]; then
            echo "Explicit full redeploy requested."
            supabase functions deploy --project-ref "$PROJECT_REF"
          else
            echo "Deploying single function: $FN"
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF"
          fi
