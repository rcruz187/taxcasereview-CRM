name: Deploy Supabase Edge Functions

# Scoped production deploys only. Pushes are restricted to known function paths so
# an unrelated change can never trigger a blanket Edge Function redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/hub-proxy/**'
      - 'supabase/functions/linkedin-scheduler/**'
      - 'supabase/functions/linkedin-queue-replenisher/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Function slug to deploy (or ALL_INTENTIONAL for a full redeploy)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Resolve scoped function
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fn=${{ github.event.inputs.function }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only HEAD^ HEAD)"
          if echo "$CHANGED" | grep -q '^supabase/functions/linkedin-queue-replenisher/'; then
            echo "fn=linkedin-queue-replenisher" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -q '^supabase/functions/linkedin-scheduler/'; then
            echo "fn=linkedin-scheduler" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -q '^supabase/functions/hub-proxy/'; then
            echo "fn=hub-proxy" >> "$GITHUB_OUTPUT"
          else
            echo "No supported function path changed."
            exit 1
          fi
      - name: Deploy edge function
        shell: bash
        run: |
          set -euo pipefail
          FN="${{ steps.scope.outputs.fn }}"
          if [ "$FN" = "ALL_INTENTIONAL" ]; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          elif [ "$FN" = "linkedin-queue-replenisher" ]; then
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF" --no-verify-jwt
          else
            supabase functions deploy "$FN" --project-ref "$PROJECT_REF"
          fi
