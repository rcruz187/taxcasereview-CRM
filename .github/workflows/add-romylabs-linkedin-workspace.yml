name: Add RomyLabs LinkedIn Workspace
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-romylabs-linkedin-workspace.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Apply isolated LinkedIn workspace patch
        run: node scripts/add_romylabs_linkedin_workspace.cjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify isolation
        run: |
          grep -q "product_id:'romylabs', name:'RomyLabs Corporate'" src/pages/AdminPortal.jsx
          grep -q "linkedin-publish" src/pages/AdminPortal.jsx
          grep -q "product_id: selectedPid" src/pages/AdminPortal.jsx
          git diff --check
      - name: Commit integration
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx
          git diff --cached --quiet || git commit -m 'feat(linkedin): add RomyLabs corporate workspace'
          git push origin HEAD:main
