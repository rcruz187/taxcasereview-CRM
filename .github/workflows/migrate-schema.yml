name: Migrate Schema TCR to Nashville
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Dump TCR schema via session pooler port 5432
        run: |
          # Session pooler supports pg_dump, port 5432, IPv4
          PGPASSWORD="5b4zhcuTttEfL3YZ" pg_dump \
            --host=aws-0-us-east-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.mpxgxfqdbquzkrvvejkh \
            --dbname=postgres \
            --schema-only \
            --no-owner \
            --no-acl \
            --schema=public \
            -f tcr-schema.sql 2>&1
          echo "Exit: $?"
          echo "Lines: $(wc -l < tcr-schema.sql 2>/dev/null || echo 0)"
          head -5 tcr-schema.sql 2>/dev/null || echo "empty"

      - name: Restore to Nashville
        if: success()
        run: |
          PGPASSWORD="rsqY3zU6QUiiAISB" psql \
            --host=aws-0-us-west-2.pooler.supabase.com \
            --port=5432 \
            --username=postgres.alozyneyvvtjekiyqdyb \
            --dbname=postgres \
            -f tcr-schema.sql 2>&1 | tail -30
          echo "Restore exit: $?"
