name: Migrate Schema TCR to Nashville
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Dump and report
        env:
          GH_PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Try pg_dump and capture everything
          PGPASSWORD="5b4zhcuTttEfL3YZ" pg_dump \
            --host=aws-0-us-east-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.mpxgxfqdbquzkrvvejkh \
            --dbname=postgres \
            --schema-only \
            --no-owner \
            --no-acl \
            --schema=public \
            -f tcr-schema.sql > stdout.txt 2> stderr.txt
          EXIT=$?
          
          BODY="Exit: $EXIT\n\nSTDOUT:\n$(cat stdout.txt | head -20)\n\nSTDERR:\n$(cat stderr.txt | head -30)\n\nLines: $(wc -l < tcr-schema.sql 2>/dev/null || echo 0)"
          
          curl -s -X POST \
            "https://api.github.com/repos/taxresolutioncrm/taxcasereview-CRM/issues" \
            -H "Authorization: token $GH_PAT" \
            -H "Content-Type: application/json" \
            -d "{\"title\": \"dump-diag-$GITHUB_RUN_ID\", \"body\": \"$BODY\"}"
          
          exit $EXIT
