name: Migrate Schema TCR to Nashville
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Dump TCR schema and restore to Nashville
        run: |
          set -e
          
          # Session pooler port 6543 worked in connectivity test
          TCR="postgresql://postgres.mpxgxfqdbquzkrvvejkh:5b4zhcuTttEfL3YZ@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require"
          NAS="postgresql://postgres.alozyneyvvtjekiyqdyb:rsqY3zU6QUiiAISB@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require"
          
          echo "Dumping TCR schema..."
          PGPASSWORD="5b4zhcuTttEfL3YZ" pg_dump \
            "$TCR" \
            --schema-only \
            --no-owner \
            --no-acl \
            --schema=public \
            -f tcr-schema.sql
          
          echo "Lines dumped: $(wc -l < tcr-schema.sql)"
          echo "First 5 lines:"
          head -5 tcr-schema.sql
          
          echo "Restoring to Nashville..."
          PGPASSWORD="rsqY3zU6QUiiAISB" psql "$NAS" -f tcr-schema.sql
          
          echo "DONE - verifying Nashville tables..."
          PGPASSWORD="rsqY3zU6QUiiAISB" psql "$NAS" \
            -c "SELECT count(*) as table_count FROM pg_tables WHERE schemaname='public';"
