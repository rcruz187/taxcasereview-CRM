name: Migrate Schema TCR to Nashville
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Test all connection methods
        run: |
          echo "=== Testing TCR connections ==="
          
          # Method 1: Direct IPv6
          echo "Method 1: Direct port 5432"
          timeout 10 PGPASSWORD="5b4zhcuTttEfL3YZ" psql \
            "postgresql://postgres:5b4zhcuTttEfL3YZ@db.mpxgxfqdbquzkrvvejkh.supabase.co:5432/postgres?sslmode=require" \
            -c "SELECT 1 as test;" 2>&1 || echo "FAILED"
          
          # Method 2: Session pooler port 5432
          echo "Method 2: Session pooler port 5432"
          timeout 10 PGPASSWORD="5b4zhcuTttEfL3YZ" psql \
            "postgresql://postgres.mpxgxfqdbquzkrvvejkh:5b4zhcuTttEfL3YZ@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            -c "SELECT 1 as test;" 2>&1 || echo "FAILED"
          
          # Method 3: Session pooler port 6543
          echo "Method 3: Session pooler port 6543"
          timeout 10 PGPASSWORD="5b4zhcuTttEfL3YZ" psql \
            "postgresql://postgres.mpxgxfqdbquzkrvvejkh:5b4zhcuTttEfL3YZ@aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require" \
            -c "SELECT 1 as test;" 2>&1 || echo "FAILED"

          echo "=== Testing Nashville connections ==="
          
          # Nashville Method 2
          echo "Nashville session pooler port 5432"
          timeout 10 PGPASSWORD="rsqY3zU6QUiiAISB" psql \
            "postgresql://postgres.alozyneyvvtjekiyqdyb:rsqY3zU6QUiiAISB@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            -c "SELECT 1 as test;" 2>&1 || echo "FAILED"
            
          # Nashville Method 3
          echo "Nashville session pooler port 6543"
          timeout 10 PGPASSWORD="rsqY3zU6QUiiAISB" psql \
            "postgresql://postgres.alozyneyvvtjekiyqdyb:rsqY3zU6QUiiAISB@aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            -c "SELECT 1 as test;" 2>&1 || echo "FAILED"
