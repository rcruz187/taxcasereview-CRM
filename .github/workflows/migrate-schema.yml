name: Migrate Schema TCR to Nashville
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Test connectivity
        run: |
          echo "Testing TCR connection..."
          PGPASSWORD="5b4zhcuTttEfL3YZ" PGCONNECT_TIMEOUT=10 psql \
            "postgresql://postgres:5b4zhcuTttEfL3YZ@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            -c "SELECT 'TCR connected' as status;" 2>&1 || echo "TCR pooler failed, trying direct..."
          
          PGPASSWORD="5b4zhcuTttEfL3YZ" PGCONNECT_TIMEOUT=10 psql \
            "postgresql://postgres.mpxgxfqdbquzkrvvejkh:5b4zhcuTttEfL3YZ@aws-0-us-east-1.pooler.supabase.com:5432/postgres" \
            -c "SELECT 'TCR pooler connected' as status;" 2>&1 || echo "TCR pooler v2 failed"

      - name: Dump TCR schema
        run: |
          # Try session pooler (IPv4, port 5432)
          PGPASSWORD="5b4zhcuTttEfL3YZ" pg_dump \
            "postgresql://postgres.mpxgxfqdbquzkrvvejkh:5b4zhcuTttEfL3YZ@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require" \
            --schema-only \
            --no-owner \
            --no-acl \
            -f tcr-schema.sql 2>&1
          echo "Exit: $?"
          wc -l tcr-schema.sql 2>/dev/null || echo "No file produced"

      - name: Restore to Nashville
        if: success()
        run: |
          PGPASSWORD="rsqY3zU6QUiiAISB" psql \
            "postgresql://postgres.alozyneyvvtjekiyqdyb:rsqY3zU6QUiiAISB@aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require" \
            -f tcr-schema.sql 2>&1 | tail -30
          echo "Restore exit: $?"
