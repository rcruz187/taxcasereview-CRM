name: RomyLabs Meet Hub Wire

on:
  push:
    branches:
      - feature/romylabs-meet-admin-hub
    paths:
      - '.github/workflows/romylabs-meet-hub-wire.yml'
      - 'scripts/romylabs-meet-hub-wire.mjs'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/romylabs-meet-admin-hub
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/romylabs-meet-hub-wire.mjs
      - name: Commit wiring if needed
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPortal.jsx
          git commit -m "feat: wire Meet and Training hub into admin portal"
          git push origin HEAD:feature/romylabs-meet-admin-hub
