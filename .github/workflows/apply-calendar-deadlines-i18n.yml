name: Apply Calendar Deadlines Spanish Coverage

on:
  push:
    paths:
      - '.github/scripts/expand_calendar_deadlines_i18n.py'
      - '.github/workflows/apply-calendar-deadlines-i18n.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand Calendar and Deadlines Spanish coverage
        run: python .github/scripts/expand_calendar_deadlines_i18n.py
      - name: Commit translated source
        run: |
          if git diff --quiet; then
            echo 'No translation changes required.'
            exit 0
          fi
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'actions@github.com'
          git add src/lib/i18n.js
          git commit -m 'feat(i18n): cover calendar and deadlines workflows'
          git push origin HEAD:main
