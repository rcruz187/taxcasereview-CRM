name: Admin Portal Real Tab Fixes
on:
  push:
    branches: [fix/admin-portal-real-tab-audit-20260827]
    paths: ['.github/workflows/admin-portal-real-tab-fixes.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: fix/admin-portal-real-tab-audit-20260827, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Apply portal fixes
        run: node scripts/admin-portal-real-tab-fixes.cjs
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Verify all visible admin routes and Command Center tabs
        run: |
          for r in command-center email calendar chat provision offices demo employees support audit billing; do grep -q "path=\"/$r\"" src/pages/AdminPortal.jsx; done
          for t in overview support products marketing search linkedin content sales crm goals system; do grep -q "key:'$t'" src/pages/AdminPortal.jsx; done
          grep -q 'tenants,' src/pages/AdminPortal.jsx
          grep -q 'Unable to load offices:' src/pages/AdminPortal.jsx
          grep -q 'Unable to load platform offices:' src/pages/AdminPortal.jsx
          grep -q 'Unable to load audit log:' src/pages/AdminPortal.jsx
          grep -qi 'function public.admin_tenant_overview' supabase/migrations/20260828033000_admin_portal_office_contracts.sql
          grep -qi 'function public.get_office_full' supabase/migrations/20260828033000_admin_portal_office_contracts.sql
          git diff --check
      - name: Commit generated source
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx
          git diff --cached --quiet || git commit -m 'fix(admin): restore office data and harden tab failures'
          git push origin HEAD:fix/admin-portal-real-tab-audit-20260827
