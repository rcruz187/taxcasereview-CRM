name: Migrate Nashville Data
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase'
        required: true
        default: 'test'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install postgres client
        run: sudo apt-get install -y postgresql-client -qq

      - name: Migrate
        env:
          GH_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          NASH="489ace07-1a6b-4864-833a-4f8420568b40"

          echo "Testing TCR..."
          TCR_RESULT=$(PGPASSWORD="5b4zhcuTttEfL3YZ" psql \
            "host=aws-0-us-east-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.mpxgxfqdbquzkrvvejkh sslmode=require" \
            -c "SELECT COUNT(*) FROM clients WHERE tenant_id='$NASH';" 2>&1)
          echo "TCR: $TCR_RESULT"

          echo "Testing Nashville..."
          NAS_RESULT=$(PGPASSWORD="rsqY3zU6QUiiAISB" psql \
            "host=aws-0-us-west-2.pooler.supabase.com port=5432 dbname=postgres user=postgres.ydrvncdedgjtcprczwpu sslmode=require" \
            -c "SELECT COUNT(*) FROM clients WHERE tenant_id='$NASH';" 2>&1)
          echo "NAS: $NAS_RESULT"

          # Post results as issue
          BODY="TCR: $TCR_RESULT\n\nNAS: $NAS_RESULT"
          curl -s -X POST \
            "https://api.github.com/repos/taxresolutioncrm/taxcasereview-CRM/issues" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"migrate-test-$GITHUB_RUN_ID\",\"body\":\"$BODY\"}" > /dev/null
