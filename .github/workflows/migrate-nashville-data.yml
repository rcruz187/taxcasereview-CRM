name: Migrate Nashville Data
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase: employees, clients_1, clients_2, cases, transactions, all_meta'
        required: true
        default: 'employees'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Migrate via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          NASH="489ace07-1a6b-4864-833a-4f8420568b40"
          TCR_REF="mpxgxfqdbquzkrvvejkh"
          NAS_REF="ydrvncdedgjtcprczwpu"
          PHASE="${{ github.event.inputs.phase }}"

          query_tcr() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$TCR_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"$1\"}"
          }

          run_nas() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$NAS_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"$1\"}"
          }

          echo "=== Testing API access ==="
          query_tcr "SELECT COUNT(*) as cnt FROM employees WHERE tenant_id='$NASH'"
          run_nas "SELECT COUNT(*) as cnt FROM employees WHERE tenant_id='$NASH'"

          echo "Done"
