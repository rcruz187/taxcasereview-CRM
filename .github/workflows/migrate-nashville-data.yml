name: Migrate Nashville Data
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase: employees, clients, cases, transactions, meta'
        required: true
        default: 'clients'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TCR: mpxgxfqdbquzkrvvejkh
          NAS: ydrvncdedgjtcprczwpu
          NASH: 489ace07-1a6b-4864-833a-4f8420568b40
          PHASE: ${{ github.event.inputs.phase }}
        run: |
          run_table() { TABLE=$1 python3 scripts/migrate_nashville.py; }
          case "$PHASE" in
            employees) run_table employees ;;
            clients) run_table clients ;;
            cases) run_table cases ;;
            transactions) run_table payment_transactions; run_table payments ;;
            meta) run_table client_notes; run_table lead_notes; run_table leads; run_table tasks; run_table calevents; run_table invoices; run_table documents; run_table esigns; run_table workflow_templates; run_table workflow_statuses; run_table workflow_status_categories; run_table deadlines; run_table poa_records ;;
          esac
