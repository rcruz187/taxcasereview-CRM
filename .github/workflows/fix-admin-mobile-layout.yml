name: Fix Admin Mobile Layout

on:
  push:
    paths:
      - '.github/workflows/fix-admin-mobile-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Admin Portal mobile shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/AdminPortal.jsx')
          s=p.read_text()
          old="""function Sidebar({ onSignOut }) {
  const location = useLocation()
  return (
    <div style={{ width:220, minHeight:'100vh', flexShrink:0, background:'#0f0e1a',
      borderRight:'1px solid rgba(99,102,241,.2)', display:'flex', flexDirection:'column' }}>"""
          new="""function Sidebar({ onSignOut, mobile=false, onClose }) {
  const location = useLocation()
  return (
    <div style={{ width:mobile ? 'min(86vw,300px)' : 220, minHeight:'100vh', flexShrink:0, background:'#0f0e1a',
      borderRight:'1px solid rgba(99,102,241,.2)', display:'flex', flexDirection:'column' }}>"""
          if old not in s: raise SystemExit('sidebar signature pattern missing')
          s=s.replace(old,new,1)
          old="""<NavLink key={item.path} to={item.path}
              style={{ display:'flex', alignItems:'center', gap:9, padding:'8px 11px',"""
          new="""<NavLink key={item.path} to={item.path} onClick={mobile ? onClose : undefined}
              style={{ display:'flex', alignItems:'center', gap:9, padding:mobile ? '11px 12px' : '8px 11px',"""
          if old not in s: raise SystemExit('navlink pattern missing')
          s=s.replace(old,new,1)
          old="""export default function AdminPortal() {
  const navigate = useNavigate()
  const location = useLocation()
  const { logout } = useApp()"""
          new="""export default function AdminPortal() {
  const navigate = useNavigate()
  const location = useLocation()
  const { logout } = useApp()
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false)"""
          if old not in s: raise SystemExit('admin function pattern missing')
          s=s.replace(old,new,1)
          old="""  return (
    <ScreenShareProvider>
    <div style={{display:'flex',minHeight:'100vh',background:'#0d0c1a',fontFamily:'system-ui,Arial,sans-serif'}}>
      <Sidebar onSignOut={handleSignOut} />
      <div style={{flex:1,position:'relative',height:'100vh',overflowY:'auto'}}>"""
          new="""  return (
    <ScreenShareProvider>
    <div className=\"rl-admin-shell\" style={{display:'flex',minHeight:'100vh',background:'#0d0c1a',fontFamily:'system-ui,Arial,sans-serif',width:'100%',overflowX:'hidden'}}>
      <style>{`\n        .rl-admin-mobile-bar,.rl-admin-mobile-overlay{display:none}\n        .rl-admin-desktop-sidebar{display:flex;flex-shrink:0}\n        .rl-admin-main{min-width:0;width:100%}\n        @media (max-width:768px){\n          .rl-admin-shell{display:block!important;min-height:100dvh!important}\n          .rl-admin-desktop-sidebar{display:none!important}\n          .rl-admin-mobile-bar{display:flex!important;position:sticky;top:0;z-index:9000;height:58px;align-items:center;gap:12px;padding:env(safe-area-inset-top) 14px 0;background:#0f0e1a;border-bottom:1px solid rgba(99,102,241,.22)}\n          .rl-admin-mobile-menu-btn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(99,102,241,.28);background:rgba(99,102,241,.10);color:#e2e8f0;font-size:21px;display:flex;align-items:center;justify-content:center}\n          .rl-admin-mobile-overlay{display:flex!important;position:fixed;inset:0;z-index:9500;background:rgba(2,6,23,.72);backdrop-filter:blur(3px)}\n          .rl-admin-mobile-drawer{height:100%;overflow-y:auto;box-shadow:16px 0 40px rgba(0,0,0,.45)}\n          .rl-admin-mobile-scrim{flex:1;height:100%}\n          .rl-admin-main{height:calc(100dvh - 58px)!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch}\n          .rl-admin-main table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}\n          .rl-admin-main input,.rl-admin-main select,.rl-admin-main textarea{max-width:100%;box-sizing:border-box}\n          .rl-admin-main button,.rl-admin-main a{touch-action:manipulation}\n        }\n      `}</style>
      <div className=\"rl-admin-desktop-sidebar\"><Sidebar onSignOut={handleSignOut} /></div>
      <div className=\"rl-admin-mobile-bar\">
        <button className=\"rl-admin-mobile-menu-btn\" onClick={()=>setMobileMenuOpen(true)} aria-label=\"Open navigation\">☰</button>
        <img src=\"/romylabs-logo.png\" alt=\"RomyLabs\" style={{height:30,maxWidth:150,objectFit:'contain'}} />
        <span style={{marginLeft:'auto',fontSize:10,fontWeight:800,color:'#C6FF00',letterSpacing:'.05em'}}>ADMIN</span>
      </div>
      {mobileMenuOpen && <div className=\"rl-admin-mobile-overlay\">
        <div className=\"rl-admin-mobile-drawer\"><Sidebar mobile onClose={()=>setMobileMenuOpen(false)} onSignOut={handleSignOut} /></div>
        <div className=\"rl-admin-mobile-scrim\" onClick={()=>setMobileMenuOpen(false)} />
      </div>}
      <div className=\"rl-admin-main\" style={{flex:1,position:'relative',height:'100vh',overflowY:'auto'}}>"""
          if old not in s: raise SystemExit('shell pattern missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q 'rl-admin-mobile-bar' src/pages/AdminPortal.jsx
          grep -q 'Sidebar mobile' src/pages/AdminPortal.jsx
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'RomyLabs Bot'
          git config user.email 'actions@github.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): make portal shell mobile responsive'
          git push
