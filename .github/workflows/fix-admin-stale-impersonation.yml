name: Harden Admin Portal Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-stale-impersonation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Harden owner routing against stale impersonation state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '''  // Check for active impersonation session\n  const isImpersonating = !!sessionStorage.getItem('admin_impersonation')\n  const impParam = new URLSearchParams(window.location.search).get('imp')\n\n  useEffect(() => {\n    // Admin routing is host-scoped. Owner credentials on TaxRes must stay in CRM.\n    if (isAdminHost && isPlatformOwner(user?.email) && !isImpersonating && !impParam) {\n      navigate('/crm-admin', { replace: true })\n    }\n  }, [user, isAdminHost, isImpersonating, impParam, navigate])\n\n  // Product hosts always render their CRM, including for RomyLabs owners.\n  if (!isAdminHost) return <Shell />\n  if (isImpersonating || impParam) return <Shell />\n  if (isPlatformOwner(user?.email) && !isImpersonating) return null\n  return <Shell />'''
          new = '''  // Impersonation is intentional only when the current URL explicitly carries\n  // the impersonation marker. A stale sessionStorage flag from a prior Jump In\n  // must never strand a platform owner in the tenant CRM on admin.romylabs.com.\n  const impParam = new URLSearchParams(window.location.search).get('imp')\n  const hasExplicitImpersonationIntent = impParam === '1' || impParam === 'true'\n  const storedImpersonation = !!sessionStorage.getItem('admin_impersonation')\n  const isImpersonating = hasExplicitImpersonationIntent && storedImpersonation\n\n  useEffect(() => {\n    // Admin routing is host-scoped. Owner credentials on TaxRes must stay in CRM.\n    if (!isAdminHost || !isPlatformOwner(user?.email)) return\n\n    // Clear stale Jump In state when the owner arrives normally at the admin host.\n    if (!hasExplicitImpersonationIntent && storedImpersonation) {\n      sessionStorage.removeItem('admin_impersonation')\n      supabase.rpc('set_admin_tenant_override', { p_tenant_id: null }).catch(() => {})\n    }\n\n    if (!hasExplicitImpersonationIntent) {\n      navigate('/crm-admin', { replace: true })\n    }\n  }, [user, isAdminHost, hasExplicitImpersonationIntent, storedImpersonation, navigate])\n\n  // Product hosts always render their CRM, including for RomyLabs owners.\n  if (!isAdminHost) return <Shell />\n  if (isImpersonating) return <Shell />\n  if (isPlatformOwner(user?.email)) return null\n  return <Shell />'''
          if old not in s:
              raise SystemExit('Expected AdminGate block not found; refusing blind patch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify hardening
        run: |
          grep -q "hasExplicitImpersonationIntent" src/App.jsx
          grep -q "sessionStorage.removeItem('admin_impersonation')" src/App.jsx
          grep -q "set_admin_tenant_override" src/App.jsx
      - name: Commit hardening
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admin): clear stale impersonation before owner routing"
          git push origin main
