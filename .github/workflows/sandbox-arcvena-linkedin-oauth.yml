name: Sandbox Arcvena LinkedIn OAuth

on:
  push:
    branches:
      - sandbox/arcvena-linkedin-oauth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify OAuth source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const REDIRECT_URI = 'https://admin.romylabs.com/crm-admin/linkedin/callback'" src/pages/AdminPortal.jsx
          grep -Fq "w_organization_social" src/pages/AdminPortal.jsx
          grep -Fq "linkedin_oauth_product" src/pages/AdminPortal.jsx
          grep -Fq "product_id: oauthProduct" src/pages/AdminPortal.jsx
          grep -Fq "linkedin_organization_id: linkedinOrganizationId" supabase/functions/linkedin-publish/index.ts
          grep -Fq "const linkedinOrganizationId = isArcvena ? '146118085' : null" supabase/functions/linkedin-publish/index.ts
          echo SANDBOX_OAUTH_CONTRACT_GREEN
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: No merge markers
        shell: bash
        run: |
          ! git grep -nE '^(<<<<<<< .+|>>>>>>> .+)$' -- ':!package-lock.json'
      - name: Publish sandbox artifact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist -b sandbox-arcvena-linkedin-pages --dotfiles --add -u "GitHub Actions <actions@github.com>"
          echo SANDBOX_PUBLISH_GREEN

      - name: Read-only live admin fingerprint
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://admin.romylabs.com/?sandbox_probe=arcvena_linkedin' || true)"
          if [ -z "$html" ]; then
            echo LIVE_ADMIN_REACHABLE=0
            exit 0
          fi
          echo LIVE_ADMIN_REACHABLE=1
          asset="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js[^"]*"' | head -1 | cut -d'"' -f2 || true)"
          if [ -z "$asset" ]; then
            echo LIVE_ADMIN_JS_ASSET=0
            exit 0
          fi
          case "$asset" in
            http*) url="$asset" ;;
            /*) url="https://admin.romylabs.com$asset" ;;
            *) url="https://admin.romylabs.com/$asset" ;;
          esac
          js="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$url" || true)"
          if printf '%s' "$js" | grep -Fq 'https://admin.romylabs.com/crm-admin/linkedin/callback'; then
            echo LIVE_FIXED_REDIRECT=1
          else
            echo LIVE_FIXED_REDIRECT=0
          fi
          if printf '%s' "$js" | grep -Fq 'w_organization_social'; then
            echo LIVE_ORG_SCOPE=1
          else
            echo LIVE_ORG_SCOPE=0
          fi
      - name: Green marker
        run: echo SANDBOX_ARCVENA_LINKEDIN_OAUTH_GREEN
