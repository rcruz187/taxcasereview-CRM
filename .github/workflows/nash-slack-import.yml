name: Nash Slack Import (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      NASH_URL: ${{ secrets.NASH_SUPABASE_URL }}
      NASH_KEY: ${{ secrets.NASH_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install requests

      - name: Run Slack import via PostgREST bulk insert
        run: |
          python3 << 'PYEOF'
          import json, requests, os, sys

          NASH_URL = os.environ["NASH_URL"]
          NASH_KEY = os.environ["NASH_KEY"]
          HEADERS = {
              "apikey": NASH_KEY,
              "Authorization": f"Bearer {NASH_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
          }

          # Step 1: Create table if not exists via Management API alternative
          # Use PostgREST RPC to run DDL — need to create an RPC or use direct insert
          # PostgREST supports bulk inserts directly to /rest/v1/<table>
          # Table must exist first — check if it exists

          check = requests.get(f"{NASH_URL}/rest/v1/chat_messages?limit=1",
              headers={**HEADERS, "Prefer": "count=exact"})
          print(f"Table check: {check.status_code}")

          if check.status_code == 404 or "does not exist" in check.text:
              print("Table does not exist — needs DDL first")
              sys.exit(1)
          elif check.status_code in (200, 206):
              print("Table exists — proceeding with insert")
          else:
              print(f"Unexpected: {check.status_code} {check.text[:200]}")
              sys.exit(1)

          # Step 2: Load messages
          with open("scripts/nash_messages.json") as f:
              msgs = json.load(f)
          print(f"Total messages to insert: {len(msgs)}")

          # Step 3: Bulk insert in batches of 200
          batch_size = 200
          inserted = 0
          errors = 0
          for i in range(0, len(msgs), batch_size):
              batch = msgs[i:i+batch_size]
              resp = requests.post(
                  f"{NASH_URL}/rest/v1/chat_messages",
                  headers=HEADERS,
                  json=batch,
                  timeout=30
              )
              if resp.status_code in (200, 201):
                  inserted += len(batch)
                  print(f"Batch {i//batch_size + 1}: {len(batch)} inserted (total {inserted})")
              else:
                  errors += 1
                  print(f"Batch {i//batch_size + 1} FAILED: {resp.status_code} {resp.text[:200]}")

          print(f"\nDone: {inserted} inserted, {errors} failed batches")
          PYEOF

      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"nash-import-result ${{ github.run_id }}\",\"body\":\"Nash Slack import workflow completed. Run ID: ${{ github.run_id }}\",\"labels\":[\"sql-result\"]}"
