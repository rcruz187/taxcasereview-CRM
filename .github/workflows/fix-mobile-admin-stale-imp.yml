name: Fix Mobile Admin Stale Impersonation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-admin-stale-imp.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Patch exact mobile impersonation boundary
        shell: python
        run: |
          from pathlib import Path

          hotfix = Path('public/romylabs-admin-hotfix.js')
          s = hotfix.read_text()
          old = "  var isActiveImpersonation = params.get('imp') === '1';"
          new = """  var storedImpersonation = false;\n  try { storedImpersonation = !!sessionStorage.getItem('admin_impersonation'); } catch (_) {}\n  // Only the validated Jump In landing route may preserve ?imp=1. A stale\n  // mobile /login?imp=1 or /crm-admin?imp=1 must never boot a tenant/demo CRM.\n  var isActiveImpersonation = path === '/' && params.get('imp') === '1' && storedImpersonation;"""
          if old not in s:
              raise SystemExit('Expected hotfix impersonation line not found; refusing broad patch')
          hotfix.write_text(s.replace(old, new, 1))

          index = Path('index.html')
          h = index.read_text()
          old_v = '/romylabs-admin-hotfix.js?v=20260830-mobile-session-2'
          new_v = '/romylabs-admin-hotfix.js?v=20260830-mobile-session-3'
          if old_v not in h:
              raise SystemExit('Expected admin hotfix cache version not found; refusing broad patch')
          index.write_text(h.replace(old_v, new_v, 1))

          marker = Path('public/admin-portal-build.txt')
          m = marker.read_text()
          if 'mobile-admin-imp-fix=20260830-v3' not in m:
              marker.write_text(m.rstrip() + '\nmobile-admin-imp-fix=20260830-v3\n')

      - name: Verify targeted changes
        run: |
          grep -q "path === '/' && params.get('imp') === '1' && storedImpersonation" public/romylabs-admin-hotfix.js
          grep -q "romylabs-admin-hotfix.js?v=20260830-mobile-session-3" index.html
          grep -q "mobile-admin-imp-fix=20260830-v3" public/admin-portal-build.txt

      - name: Install dependencies
        run: npm ci

      - name: Build CRM
        run: npm run build

      - name: Commit targeted fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add public/romylabs-admin-hotfix.js index.html public/admin-portal-build.txt
          git commit -m "fix(admin): reject stale mobile impersonation URLs"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
