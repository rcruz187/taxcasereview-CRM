name: Admin Office Hardening
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-office-hardening.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch office error handling and fake demo action
        run: |
          node <<'NODE'
          const fs=require('fs')
          const p='src/pages/AdminPortal.jsx'
          let s=fs.readFileSync(p,'utf8')
          const edits=[
            ["  const [data, setData] = useState(null)\n  const [tab, setTab] = useState('overview')", "  const [data, setData] = useState(null)\n  const [loadError, setLoadError] = useState(null)\n  const [tab, setTab] = useState('overview')"],
            ["    supabase.rpc('get_office_full', { p_tenant_id: id })\n      .then(({ data:d, error }) => {\n        if (error) { toast_(error.message,'error'); return }", "    setLoadError(null)\n    supabase.rpc('get_office_full', { p_tenant_id: id })\n      .then(({ data:d, error }) => {\n        if (error) { setLoadError(error.message); toast_(error.message,'error'); return }\n        if (!d?.tenant) { setLoadError('Office data was not returned by get_office_full.'); return }"],
            ["  async function resetDemo() {\n    if (!confirm(`Reset ${data?.tenant?.firm_name} to a clean demo state? This wipes all leads, clients, tasks, notes, and activity.`)) return\n    // Run the demo reset SQL via the SQL runner pattern\n    toast_('Demo reset queued — check back in 30 seconds', 'ok')\n  }", "  function resetDemo() {\n    toast_('Demo reset is disabled until a secured server-side reset endpoint is deployed.', 'error')\n  }"],
            ["  if (!data) return <Spinner />", "  if (loadError) return (\n    <div style={{ padding:40, maxWidth:760 }}>\n      <div style={{ ...S.card, padding:24, border:'1px solid rgba(239,68,68,.35)' }}>\n        <div style={{ color:'#ef4444', fontWeight:800, marginBottom:8 }}>Unable to load office</div>\n        <div style={{ color:'#94a3b8', fontSize:13, lineHeight:1.6 }}>{loadError}</div>\n        <button onClick={()=>navigate('/crm-admin/offices')} style={{ ...S.btn('ghost'), marginTop:16 }}>← Back to Offices</button>\n      </div>\n    </div>\n  )\n  if (!data) return <Spinner />"],
            ["                <button onClick={resetDemo} style={{ ...S.btn('danger'), fontSize:12 }}>🔄 Reset Demo Data</button>", "                <button onClick={resetDemo} disabled title=\"Requires secured server-side reset endpoint\" style={{ ...S.btn('danger'), fontSize:12, opacity:.45, cursor:'not-allowed' }}>🔒 Demo Reset Unavailable</button>"]
          ]
          for (const [a,b] of edits) {
            const n=s.split(a).length-1
            if(n!==1) throw new Error(`Expected one match, found ${n}: ${a.slice(0,80)}`)
            s=s.replace(a,b)
          }
          fs.writeFileSync(p,s)
          NODE
      - run: npm ci
      - run: npm run build
      - name: Verify no fake demo reset and persistent office load error
        run: |
          ! grep -Fq 'Demo reset queued' src/pages/AdminPortal.jsx
          grep -Fq 'Unable to load office' src/pages/AdminPortal.jsx
          grep -Fq 'Demo Reset Unavailable' src/pages/AdminPortal.jsx
      - name: Commit
        run: |
          git config user.name 'RomyLabs Audit Bot'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): surface office RPC failures and disable fake demo reset'
          git push origin HEAD:main
