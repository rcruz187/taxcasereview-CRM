name: Deploy Nashville Edge Functions
on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy (or ALL_INTENTIONAL for all)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="ydrvncdedgjtcprczwpu"
          FUNCTION="${{ github.event.inputs.function }}"

          if [ "$FUNCTION" = "ALL_INTENTIONAL" ]; then
            echo "Deploying all functions to Nashville..."
            for fn in $(ls supabase/functions/ | grep -v "^_"); do
              echo "Deploying: $fn"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" || echo "FAILED: $fn"
            done
          else
            echo "Deploying: $FUNCTION"
            supabase functions deploy "$FUNCTION" --project-ref "$PROJECT_REF"
          fi
