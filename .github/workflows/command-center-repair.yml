name: Command Center Source Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/command-center-repair.yml'
      - 'scripts/repair-command-center.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct source repair
        run: node scripts/repair-command-center.cjs

      - name: Remove temporary Vite transform
        run: git show ba004b2f89063ce21af00b97fb1b40dcbb3ed96d:vite.config.js > vite.config.js

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify repair landed in source
        run: |
          grep -q "const \[crmAccount, setCrmAccount\] = useState('all')" src/pages/AdminPortal.jsx
          ! grep -q "const \[crmAccount, setCrmAccount\] = React.useState('all')" src/pages/AdminPortal.jsx
          grep -q "info@romylabs.com" src/App.jsx

      - name: Commit verified source repair
        run: |
          git config user.name "RomyLabs Repair Bot"
          git config user.email "rcruz187@gmail.com"
          git add src/pages/AdminPortal.jsx src/App.jsx vite.config.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): direct Command Center source repair"
          git push origin HEAD:main
