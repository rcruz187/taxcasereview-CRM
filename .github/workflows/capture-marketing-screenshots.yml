name: Capture Marketing Screenshots
on:
  push:
    branches: [main]
    paths:
      - 'e2e/marketing-capture.spec.mjs'
      - '.github/workflows/capture-marketing-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app and browser test dependencies
        run: |
          npm ci
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/tcr-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tcr-preview.log
          exit 1
      - name: Capture current product screens
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/marketing-capture.spec.mjs --browser=chromium --reporter=line
      - name: Upload marketing screenshots
        uses: actions/upload-artifact@v4
        with:
          name: taxres-marketing-screenshots
          path: marketing-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
