name: Nash Run SQL (one-shot)
on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL'
        required: true
permissions:
  contents: read
  issues: write
jobs:
  run-sql:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ydrvncdedgjtcprczwpu
      SQL_INPUT: ${{ github.event.inputs.sql }}
    steps:
      - name: Execute
        run: |
          printf '%s' "$SQL_INPUT" > /tmp/stmt.sql
          jq -Rs '{query: .}' < /tmp/stmt.sql > /tmp/body.json
          curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/body.json
          jq '.' /tmp/out.json 2>/dev/null || cat /tmp/out.json
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -Rs --arg t "nash-sql-result ${{ github.run_id }}" '{title:$t,body:("```json\n"+.+"\n```"),labels:["sql-result"]}' /tmp/out.json > /tmp/issue.json
          curl -sS -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues" --data-binary @/tmp/issue.json | jq -r '.number'
