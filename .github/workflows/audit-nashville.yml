name: Audit Nashville
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-nashville.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Final cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          NAS="ydrvncdedgjtcprczwpu"
          NASH="489ace07-1a6b-4864-833a-4f8420568b40"

          nas() { curl -s -X POST "https://api.supabase.com/v1/projects/$NAS/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"$1\"}"; }

          # Delete the 3 test client rows
          echo "Deleting test rows..."
          nas "DELETE FROM clients WHERE id IN ('test-001', 'test-nash-001', 'api-test-001')"

          # Verify final counts
          echo "Final counts:"
          nas "SELECT (SELECT COUNT(*) FROM clients WHERE tenant_id='$NASH') as clients, (SELECT COUNT(*) FROM cases WHERE tenant_id='$NASH') as cases, (SELECT COUNT(*) FROM payment_transactions WHERE tenant_id='$NASH') as transactions, (SELECT COUNT(*) FROM employees WHERE tenant_id='$NASH') as employees"

          # Check call_logs and employee_gmail_accounts actually exist
          nas "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename IN ('call_logs','employee_gmail_accounts')"
