name: Audit Nashville
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-nashville.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/audit_nashville.py
