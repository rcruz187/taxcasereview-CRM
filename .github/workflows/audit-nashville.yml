name: Audit Nashville
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-nashville.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/audit_nashville.py 2>&1 | tee /tmp/audit.txt

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nashville-audit-${{ github.run_id }}
          path: /tmp/audit.txt
          retention-days: 1
