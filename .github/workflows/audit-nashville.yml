name: Audit Nashville
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-nashville.yml']

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run final audit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 scripts/audit_nashville.py 2>&1 | tee /tmp/audit.txt
          curl -s -X POST \
            "https://api.github.com/repos/taxresolutioncrm/taxcasereview-CRM/issues" \
            -H "Authorization: token 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" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"audit-final-$GITHUB_RUN_ID\",\"body\":$(cat /tmp/audit.txt | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}"
