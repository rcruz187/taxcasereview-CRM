name: Apply Admin Real Calendar

on:
  push:
    paths:
      - '.github/workflows/apply-admin-real-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply real calendar patch
        run: python3 .github/scripts/swap_admin_real_calendar.py
      - name: Verify source
        run: |
          grep -q "RomyLabsCalendar from '../components/admin/RomyLabsCalendar'" src/pages/AdminPortal.jsx
          grep -q 'return <RomyLabsCalendar />' src/pages/AdminPortal.jsx
          grep -q "admin_product_calendar_events" src/components/admin/RomyLabsCalendar.jsx
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name 'RomyLabs Bot'
          git config user.email 'actions@github.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): show real RomyLabs calendar events'
          git push
