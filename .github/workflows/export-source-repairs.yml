name: Export Prebuild Source Repairs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source-repairs.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply deterministic source repair scripts
        shell: bash
        run: |
          set -euo pipefail
          npm run check-polling
          npm run manual:style
          npm run storage:fix-display
          npm run email:state-sync
          npm run email:count-sync
          npm run sidebar:badge-rpc
          npm run dashboard:glow
          npm run forms:state-esign-prefill
          npm run forms:irs-current
          npm run reports:accuracy
          npm run accounting:oauth-state
          npm run admin:metrics-proxy
          npm run admin:product-usage-labels
          npm run cases:modal-scope
          npm run ui:quick-create
          npm run ui:navigation-audit
      - name: Commit materialized repairs to isolated audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RomyLabs Audit Repair'
          git config user.email 'actions@github.com'
          git checkout -B audit/materialized-source-repairs
          git add src
          if git diff --cached --quiet; then
            echo 'No source drift to materialize'
            exit 0
          fi
          git commit -m 'fix: materialize deterministic prebuild source repairs'
          git push --force-with-lease origin HEAD:audit/materialized-source-repairs
