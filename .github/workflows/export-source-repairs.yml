name: Export Prebuild Source Repairs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-source-repairs.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply deterministic source repair scripts
        shell: bash
        run: |
          set -euo pipefail
          npm run check-polling
          npm run manual:style
          npm run storage:fix-display
          npm run email:state-sync
          npm run email:count-sync
          npm run sidebar:badge-rpc
          npm run dashboard:glow
          npm run forms:state-esign-prefill
          npm run forms:irs-current
          npm run reports:accuracy
          npm run accounting:oauth-state
          npm run admin:metrics-proxy
          npm run admin:product-usage-labels
          npm run cases:modal-scope
          npm run ui:quick-create
          npm run ui:navigation-audit
      - name: Capture changed tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT > repaired-files.txt
          mkdir -p repaired
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "repaired/$(dirname "$f")"
            cp "$f" "repaired/$f"
          done < repaired-files.txt
          echo 'Changed files:'
          cat repaired-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-source-repairs
          path: |
            repaired/
            repaired-files.txt
          if-no-files-found: error
          retention-days: 1
