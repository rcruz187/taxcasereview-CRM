name: RomyLabs Meet Branding Patch

on:
  push:
    branches:
      - feature/romylabs-meet-admin-hub
    paths:
      - '.github/workflows/romylabs-meet-branding-patch.yml'
      - 'scripts/romylabs-meet-branding-patch.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/romylabs-meet-admin-hub
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/romylabs-meet-branding-patch.mjs
      - name: Commit branding patch if needed
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MeetingRoom.jsx
          git commit -m "fix: keep admin-hosted meetings RomyLabs branded"
          git push origin HEAD:feature/romylabs-meet-admin-hub
