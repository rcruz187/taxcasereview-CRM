name: Make Portfolio KPIs Clickable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-portfolio-kpis-clickable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch portfolio KPI drilldowns
        run: python .github/scripts/make_portfolio_kpis_clickable.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'feat(admin): make portfolio KPI cards drill into products'
          git push
