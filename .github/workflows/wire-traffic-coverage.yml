name: Wire Traffic Coverage
on:
  push:
    branches: [main]
    paths:
      - 'scripts/wire-traffic-coverage.cjs'
      - 'src/components/admin/TrafficCoverage.jsx'
      - '.github/workflows/wire-traffic-coverage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Wire Admin Portal
        run: node scripts/wire-traffic-coverage.cjs
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify traffic route
        run: |
          grep -q "TrafficCoverage" src/pages/AdminPortal.jsx
          grep -q "/crm-admin/traffic" src/pages/AdminPortal.jsx
          grep -q 'admin_product_traffic_coverage' src/components/admin/TrafficCoverage.jsx
          git diff --check
      - name: Commit verified wiring
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'romy@romylabs.com'
          git add src/pages/AdminPortal.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(admin): add Traffic Coverage control plane'
          git push origin main
