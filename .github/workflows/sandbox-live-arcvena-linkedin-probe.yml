name: Sandbox Live Arcvena LinkedIn Probe

on:
  push:
    branches:
      - sandbox/arcvena-linkedin-live-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only live admin fingerprint
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://admin.romylabs.com/?probe=arcvena_linkedin_live' || true)"
          test -n "$html" || { echo LIVE_ADMIN_REACHABLE=0; exit 1; }
          echo LIVE_ADMIN_REACHABLE=1
          asset="$(printf '%s' "$html" | grep -oE 'src="/assets/index-[^"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
          test -n "$asset" || { echo LIVE_ADMIN_JS_ASSET=0; exit 1; }
          echo "LIVE_ADMIN_JS_ASSET=$asset"
          if [ "$asset" = "/assets/index-BgaOn7hq.js" ]; then
            echo LIVE_MATCHES_GH_PAGES=1
          else
            echo LIVE_MATCHES_GH_PAGES=0
          fi
          case "$asset" in
            http*) url="$asset" ;;
            /*) url="https://admin.romylabs.com$asset" ;;
            *) url="https://admin.romylabs.com/$asset" ;;
          esac
          js="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$url" || true)"
          printf '%s' "$js" | grep -Fq 'https://taxrescrm.app/crm-admin/linkedin/callback' && echo LIVE_TRUSTED_REDIRECT=1 || { echo LIVE_FIXED_REDIRECT=0; exit 2; }
          printf '%s' "$js" | grep -Fq 'https://admin.romylabs.com/crm-admin/linkedin/callback' && echo LIVE_BRIDGE_TARGET=1 || { echo LIVE_BRIDGE_TARGET=0; exit 3; }
          printf '%s' "$js" | grep -Fq 'w_organization_social' && echo LIVE_ORG_SCOPE=1 || { echo LIVE_ORG_SCOPE=0; exit 5; }
          printf '%s' "$js" | grep -Fq '146118085' && echo LIVE_ARCVENA_ORG_ID=1 || { echo LIVE_ARCVENA_ORG_ID=0; exit 4; }
          echo LIVE_ARCVENA_LINKEDIN_BUNDLE_GREEN

