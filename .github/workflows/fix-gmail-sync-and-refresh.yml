name: Fix Gmail Sync and Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gmail-sync-and-refresh.yml'
      - 'scripts/add-email-refresh-button.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add visible Refresh Email button
        run: python scripts/add-email-refresh-button.py
      - name: Verify Gmail backend remains tenant scoped
        run: |
          grep -q "settingsByTenant" supabase/functions/gmail-sync-cron/index.ts
          grep -q "tenantByEmail" supabase/functions/gmail-sync-cron/index.ts
          grep -q "Refresh Email" src/pages/Email.jsx
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Commit frontend repair
        run: |
          git config user.name RomyLabs
          git config user.email rcruz187@gmail.com
          git add src/pages/Email.jsx
          git commit -m "fix(email): expose visible Refresh Email button"
          git push origin main
