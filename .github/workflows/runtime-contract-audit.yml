name: Runtime Contract Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-contract-audit.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Inventory database, RPC, Edge Function, and Storage contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[]
          for root in ('src','supabase/functions'):
            for p in Path(root).rglob('*'):
              if p.is_file() and p.suffix in {'.js','.jsx','.ts','.tsx','.mjs','.cjs'}:
                files.append(p)
          patterns={
            'TABLE': re.compile(r"\.from\(\s*['\"]([^'\"]+)['\"]\s*\)"),
            'RPC': re.compile(r"\.rpc\(\s*['\"]([^'\"]+)['\"]"),
            'EDGE': re.compile(r"functions\.invoke\(\s*['\"]([^'\"]+)['\"]"),
            'BUCKET': re.compile(r"storage\.from\(\s*['\"]([^'\"]+)['\"]\s*\)"),
          }
          vals={k:{} for k in patterns}
          for p in files:
            txt=p.read_text(errors='ignore')
            for kind,rx in patterns.items():
              for m in rx.finditer(txt):
                vals[kind].setdefault(m.group(1),[]).append(str(p))
          for kind in ('TABLE','RPC','EDGE','BUCKET'):
            print(f'=== {kind} CONTRACTS ({len(vals[kind])}) ===')
            for name in sorted(vals[kind]):
              refs=','.join(sorted(set(vals[kind][name])))
              print(f'{kind}|{name}|{refs}')
          print('RUNTIME_CONTRACT_INVENTORY_COMPLETE')
          PY
