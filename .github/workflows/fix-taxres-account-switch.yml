name: Fix TaxRes Account Switch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-taxres-account-switch.yml'

permissions:
  contents: write

jobs:
  fix-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch account switch flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old='''      <Route path="/login" element={\n        user && (window.location.hostname.toLowerCase() !== 'admin.romylabs.com' || isPlatformOwner(user?.email))\n          ? <Navigate to="/" replace />\n          : <Login />\n      } />'''
          new='''      <Route path="/login" element={\n        user &&\n        new URLSearchParams(window.location.search).get('switch') !== '1' &&\n        (window.location.hostname.toLowerCase() !== 'admin.romylabs.com' || isPlatformOwner(user?.email))\n          ? <Navigate to="/" replace />\n          : <Login />\n      } />'''
          if old not in s:
              raise SystemExit('current login route anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/pages/Login.jsx')
          s=p.read_text()
          if "const switchRequested = new URLSearchParams(window.location.search).get('switch') === '1'" not in s:
              anchor='''  useEffect(() => {\n    if (document.getElementById('tcr-login-bilingual-css')) return'''
              block='''  useEffect(() => {\n    const switchRequested = new URLSearchParams(window.location.search).get('switch') === '1'\n    const isAdminHost = window.location.hostname.toLowerCase() === 'admin.romylabs.com'\n    if (!switchRequested || isAdminHost) return\n    let cancelled = false\n    ;(async () => {\n      try {\n        await supabase.auth.signOut()\n        if (!cancelled) window.history.replaceState({}, '', '/login')\n      } catch (_) {}\n    })()\n    return () => { cancelled = true }\n  }, [])\n\n  useEffect(() => {\n    if (document.getElementById('tcr-login-bilingual-css')) return'''
              if anchor not in s:
                  raise SystemExit('Login useEffect anchor not found')
              s=s.replace(anchor,block,1)
          p.write_text(s)
          PY
      - name: Verify targeted source changes
        run: |
          grep -F "get('switch') !== '1'" src/App.jsx
          grep -F "await supabase.auth.signOut()" src/pages/Login.jsx
          grep -F "isAdminHost" src/pages/Login.jsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "RomyLabs"
          git config user.email "rcruz187@gmail.com"
          git add src/App.jsx src/pages/Login.jsx
          git commit -m "fix(auth): allow intentional TaxRes account switching" || true
          git push
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx gh-pages -d dist --dotfiles -u "GitHub Actions <actions@github.com>"
