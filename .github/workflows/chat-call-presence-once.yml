name: Tax Case chat call presence one-time runner
on:
  push:
    paths:
      - .github/CHAT_CALL_PRESENCE_PATCH
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply call and huddle presence patch
        run: python .github/scripts/chat_call_presence_patch.py
      - name: Commit patch locally
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/Chat.jsx
          git commit -m 'feat(chat): show live call and huddle presence'
      - name: Verify production build
        run: |
          npm ci
          npm run build
      - name: Push verified patch
        run: git push origin HEAD:main
