name: Fix Arcvena Office Drilldown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-arcvena-office-click.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch Arcvena office drilldown
        run: python .github/scripts/fix_arcvena_office_click.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit fix
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'rcruz187@gmail.com'
          git add src/pages/AdminPortal.jsx
          git commit -m 'fix(admin): keep Arcvena office drilldown inside RomyLabs'
          git push
