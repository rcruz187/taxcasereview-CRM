name: Wire Dual Tax E-Sign
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wire-dual-tax-esign.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare dual route in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old="const Esign         = lazy(() => import('./pages/Esign'))"
          new="const Esign         = lazy(() => import('./pages/TaxOfficeEsign'))"
          if old not in s and new not in s:
              raise SystemExit('Esign import anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Capture build result
        shell: bash
        run: |
          set +e
          npm run build > dual-esign-build.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> dual-esign-build.log
          exit 0
      - name: Commit diagnostic log
        run: |
          git config user.name 'RomyLabs'
          git config user.email 'romy@romylabs.com'
          git restore src/App.jsx
          git add dual-esign-build.log
          git commit -m 'chore(esign): capture dual signing build output'
          git push origin HEAD:main
