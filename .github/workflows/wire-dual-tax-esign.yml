name: Wire Dual Tax E-Sign
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wire-dual-tax-esign.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Prepare and commit dual route locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old="const Esign         = lazy(() => import('./pages/Esign'))"
          new="const Esign         = lazy(() => import('./pages/TaxOfficeEsign'))"
          if old not in s and new not in s:
              raise SystemExit('Esign import anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'RomyLabs'
          git config user.email 'romy@romylabs.com'
          git add src/App.jsx
          git diff --cached --quiet || git commit -m 'feat(esign): expose both signing options in tax offices'
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Push verified route wiring
        run: git push origin HEAD:main
