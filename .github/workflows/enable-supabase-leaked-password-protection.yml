name: Enable Supabase Leaked Password Protection

on:
  push:
    paths:
      - '.github/workflows/enable-supabase-leaked-password-protection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Enable HIBP leaked-password protection
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN missing"; exit 2; }

          curl --fail-with-body -sS -X PATCH             "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             -H "Content-Type: application/json"             --data '{"password_hibp_enabled":true}'             >/tmp/auth-update.json

          CURRENT="$(curl --fail-with-body -sS             -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"             "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")"

          ENABLED="$(printf '%s' "$CURRENT" | jq -r '.password_hibp_enabled')"
          test "$ENABLED" = "true" || { echo "Leaked password protection did not enable"; exit 1; }
          echo "Leaked password protection is enabled."
