name: Setup Nashville Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/setup-nashville-cloudflare.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Get Nashville project details
        run: |
          CF_TOKEN="cfut_ycmXEArcGSBXDwOiQgzwIA8PHD2947E36DHoZdPHd668e199"

          ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          echo "Account: $ACCOUNT_ID"

          curl -s "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/nashville-tax-crm" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | grep -o '"subdomain":"[^"]*"\|"name":"[^"]*"\|"success":[^,}]*'
