name: Audit Command Center KPIs
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
      - name: Trace source queries
        run: |
          echo '=== DEMO/STORAGE SOURCE REFERENCES ==='
          grep -n -C 8 -E "upcomingDemos|demosToday|storage_bytes|storageFiles|file_count|Upcoming demos|Demos today|File Storage" src/pages/AdminPortal.jsx || true
      - name: Inspect live schema and suspicious data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/q.json
          import json
          q=r'''
          select jsonb_build_object(
            'calendar_columns',(select jsonb_agg(column_name order by ordinal_position) from information_schema.columns where table_schema='public' and table_name='calevents'),
            'document_columns',(select jsonb_agg(column_name order by ordinal_position) from information_schema.columns where table_schema='public' and table_name='documents'),
            'today_events',(select coalesce(jsonb_agg(to_jsonb(x)),'[]'::jsonb) from (select id,title,start_time,tenant_id from public.calevents where start_time::date=current_date order by start_time limit 50) x),
            'documents_summary',(select jsonb_build_object('count',count(*),'sum_file_size',coalesce(sum(file_size),0)) from public.documents)
          ) as audit;
          '''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/q.json
