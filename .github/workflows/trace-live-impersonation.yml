name: Trace Live Admin Impersonation
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live impersonation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY' > /tmp/q.json
          import json
          q=r'''
          select table_name,column_name,data_type,is_nullable,column_default
          from information_schema.columns
          where table_schema='public' and table_name ilike '%imperson%'
          order by table_name,ordinal_position;
          '''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/q.json > /tmp/out.json
          cat /tmp/out.json
          grep -q 'tenant_id' /tmp/out.json
          grep -q 'expires_at' /tmp/out.json
      - name: Confirm RPCs are absent and route collision exists
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/f.json
          import json
          q="select proname from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and proname in ('create_impersonation_token','validate_impersonation_token') order by proname"
          print(json.dumps({'query':q}))
          PY
          OUT=$(curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/f.json)
          echo "$OUT"
          test "$OUT" = '[]'
          grep -q 'path="/impersonate"' src/App.jsx
          grep -q "path.indexOf('/crm-admin') !== 0" public/romylabs-admin-hotfix.js
          echo 'LIVE_IMPERSONATION_BREAKS_CONFIRMED'
