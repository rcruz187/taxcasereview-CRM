name: Trace Live Admin Impersonation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trace-live-impersonation.yml']
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mpxgxfqdbquzkrvvejkh
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live impersonation contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          python3 - <<'PY' > /tmp/q.json
          import json
          q=r'''
          select 'create_impersonation_token' as name, pg_get_functiondef(p.oid) as def
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='create_impersonation_token'
          union all
          select 'validate_impersonation_token', pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='validate_impersonation_token';
          select column_name,data_type,is_nullable,column_default
          from information_schema.columns
          where table_schema='public' and table_name ilike '%imperson%'
          order by table_name,ordinal_position;
          '''
          print(json.dumps({'query':q}))
          PY
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/q.json > /tmp/out.json
          cat /tmp/out.json
          grep -q 'create_impersonation_token' /tmp/out.json
          grep -q 'validate_impersonation_token' /tmp/out.json
      - name: Verify frontend route collision
        run: |
          grep -q 'path="/impersonate"' src/App.jsx
          grep -q "path.indexOf('/crm-admin') !== 0" public/romylabs-admin-hotfix.js
          echo 'IMPERSONATION_ROUTE_COLLISION_CONFIRMED'
