<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0f1a" />
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) history.replaceState(null, null, redirect);
      })();
    </script>
    <script>
      (function(){
        var isRomyLabsAdmin = window.location.pathname.indexOf('/crm-admin') === 0;
        var TAXRES_TENANT = 'a0000000-0000-0000-0000-000000000001';
        var TAXRES_LOGO = 'https://taxrescrm.app/assets/img/logo.png';
        var SB_URL = 'https://mpxgxfqdbquzkrvvejkh.supabase.co';
        var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJtcHhn eGZxZGJxdXprcnZ2ZWpraCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc5Mjk5OTM5LCJleHAiOjIwOTQ4NzU5Mzl9'.replace(/ /g,'');
        /* Use the app's real anon key below; split assignment avoids stale injected branding code. */
        SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Im1weGd4ZnFkYnF1emtydnZlamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTk5MzksImV4cCI6MjA5NDg3NTkzOX0.puvhU1MV5nGOykizeTkwCpRR7NKKaGsVpA8oqjVjmu4';

        function setIcons(href) {
          document.querySelectorAll("link[rel*='icon'],link[rel='apple-touch-icon']").forEach(function(el){ el.remove(); });
          var link = document.createElement('link'); link.rel='icon'; link.type='image/png'; link.href=href; document.head.appendChild(link);
          var apple = document.createElement('link'); apple.rel='apple-touch-icon'; apple.sizes='180x180'; apple.href=href; document.head.appendChild(apple);
        }

        function getAccessToken(){
          try {
            for (var i=0;i<localStorage.length;i++) {
              var k=localStorage.key(i);
              if (k && k.indexOf('sb-mpxgxfqdbquzkrvvejkh-auth-token') !== -1) {
                var v=JSON.parse(localStorage.getItem(k));
                return (v && (v.access_token || (v.currentSession && v.currentSession.access_token))) || null;
              }
            }
          } catch(e) {}
          return null;
        }

        async function openTaxResProduct(){
          var jwt=getAccessToken();
          if(!jwt){ window.open('https://taxrescrm.app','_blank'); return; }
          try {
            var r=await fetch(SB_URL+'/rest/v1/rpc/create_impersonation_token',{
              method:'POST',
              headers:{'apikey':SB_ANON,'Authorization':'Bearer '+jwt,'Content-Type':'application/json'},
              body:JSON.stringify({p_tenant_id:TAXRES_TENANT})
            });
            if(!r.ok) throw new Error('token');
            var token=await r.json();
            if(typeof token==='string') window.open(window.location.origin+'/impersonate?admin_token='+encodeURIComponent(token),'_blank');
            else throw new Error('token');
          } catch(e) { window.open('https://taxrescrm.app','_blank'); }
        }

        if (isRomyLabsAdmin) {
          document.title='RomyLabs — Command Center'; setIcons('/romylabs-favicon.png');
          window.addEventListener('click',function(e){
            var btn=e.target && e.target.closest ? e.target.closest('button,a') : null;
            if(!btn) return;
            var txt=(btn.textContent||'').trim();
            if(txt.indexOf('Open')!==0) return;
            var el=btn.parentElement;
            for(var n=0;el && n<6;n++,el=el.parentElement){
              var t=(el.textContent||'');
              if(t.indexOf('Tax Res CRM')!==-1 && t.indexOf('Tax Resolution')!==-1){
                e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation();
                openTaxResProduct(); return;
              }
            }
          },true);
          function enforceAdmin(){
            var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),node;
            while((node=walker.nextNode())) if(node.nodeValue&&node.nodeValue.indexOf('romy@taxrescrm.net')!==-1) node.nodeValue=node.nodeValue.replace(/romy@taxrescrm\.net/g,'romy@romylabs.com');
          }
          window.addEventListener('DOMContentLoaded',function(){ enforceAdmin(); new MutationObserver(enforceAdmin).observe(document.body,{childList:true,subtree:true,characterData:true}); });
        } else {
          document.title='TaxRes CRM'; setIcons('/taxrescrm-favicon.png');
          function enforceTaxResProductBrand(){
            var imp=null; try{imp=JSON.parse(sessionStorage.getItem('admin_impersonation')||'null')}catch(e){}
            if(imp&&imp.tenant_id&&imp.tenant_id!==TAXRES_TENANT) return;
            document.querySelectorAll('.sidebar .brand img, aside .brand img').forEach(function(img){
              img.setAttribute('src',TAXRES_LOGO); img.setAttribute('alt','TaxRes CRM');
            });
          }
          window.addEventListener('DOMContentLoaded',function(){ enforceTaxResProductBrand(); new MutationObserver(enforceTaxResProductBrand).observe(document.body,{childList:true,subtree:true}); });
        }
      })();
    </script>
    <title>TaxRes CRM</title>
    <link rel="icon" type="image/png" href="/taxrescrm-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/taxrescrm-favicon.png" />
    <meta name="theme-color" content="#0f2150" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
