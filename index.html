<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0f1a" />
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) history.replaceState(null, null, redirect);
      })();
    </script>
    <script>
      (function(){
        /* HARD RULE: RomyLabs branding is route-scoped to /crm-admin only.
           The TaxRes product CRM must never inherit RomyLabs branding, regardless
           of which owner account or hostname opened it. */
        var isRomyLabsAdmin = window.location.pathname.indexOf('/crm-admin') === 0;

        function setIcons(href) {
          document.querySelectorAll("link[rel*='icon'],link[rel='apple-touch-icon']").forEach(function(el){ el.remove(); });
          var link = document.createElement('link');
          link.rel = 'icon'; link.type = 'image/png'; link.href = href;
          document.head.appendChild(link);
          var apple = document.createElement('link');
          apple.rel = 'apple-touch-icon'; apple.sizes = '180x180'; apple.href = href;
          document.head.appendChild(apple);
        }

        if (isRomyLabsAdmin) {
          document.title = 'RomyLabs — Command Center';
          setIcons('/romylabs-favicon.png');

          function enforceRomyLabsAdmin(){
            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
            var node;
            while ((node = walker.nextNode())) {
              if (node.nodeValue && node.nodeValue.indexOf('romy@taxrescrm.net') !== -1) {
                node.nodeValue = node.nodeValue.replace(/romy@taxrescrm\.net/g, 'romy@romylabs.com');
              }
            }
            /* No tenant logo may appear above the global Command Center greeting. */
            var all = document.querySelectorAll('h1,h2,h3,div');
            for (var i=0; i<all.length; i++) {
              var text = (all[i].textContent || '').trim();
              if (/^Good (morning|afternoon|evening), Romy/.test(text)) {
                var prev = all[i].previousElementSibling;
                if (prev && prev.querySelector && prev.querySelector('img')) prev.remove();
                break;
              }
            }
          }
          window.addEventListener('DOMContentLoaded', function(){
            enforceRomyLabsAdmin();
            new MutationObserver(enforceRomyLabsAdmin).observe(document.body, { childList:true, subtree:true, characterData:true });
          });
        } else {
          document.title = 'TaxRes CRM';
          setIcons('/taxrescrm-favicon.png');

          /* A stale RomyLabs cache was the source of the product-brand leak. */
          try {
            var cached = localStorage.getItem('tcr_firm_branding');
            if (cached && /romylabs/i.test(cached)) localStorage.removeItem('tcr_firm_branding');
          } catch (_) {}

          function enforceTaxResProductBrand(){
            /* Real office impersonation keeps that office's branding. */
            var imp = null;
            try { imp = JSON.parse(sessionStorage.getItem('admin_impersonation') || 'null'); } catch (_) {}
            if (imp && imp.tenant_id && imp.tenant_id !== 'a0000000-0000-0000-0000-000000000001') return;

            document.querySelectorAll('.sidebar .brand img, aside .brand img').forEach(function(img){
              var src = img.getAttribute('src') || '';
              var alt = img.getAttribute('alt') || '';
              if (/romylabs/i.test(src) || /romy\s*labs/i.test(alt)) {
                img.setAttribute('src','/assets/taxrescrm-logo.png');
                img.setAttribute('alt','TaxRes CRM');
              }
            });
          }
          window.addEventListener('DOMContentLoaded', function(){
            enforceTaxResProductBrand();
            new MutationObserver(enforceTaxResProductBrand).observe(document.body, { childList:true, subtree:true, attributes:true, attributeFilter:['src','alt'] });
          });
        }
      })();
    </script>
    <title>TaxRes CRM</title>
    <link rel="icon" type="image/png" href="/taxrescrm-favicon.png" />
    <link rel="icon" type="image/x-icon" href="/taxrescrm-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/taxrescrm-favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/taxrescrm-favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/taxrescrm-favicon.png" />
