    <meta charset="UTF-8" />

    <meta http-equiv="Pragma" content="no-cache" />

    <meta name="theme-color" content="#0a0f1a" />
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) history.replaceState(null, null, redirect);
      })();
    </script>
    <script>
      (function(){
        if (window.location.hostname === 'admin.romylabs.com') {
          document.title = 'RomyLabs — Command Center';
          document.querySelectorAll("link[rel*='icon'],link[rel='apple-touch-icon']").forEach(function(el){ el.remove(); });
          var link = document.createElement('link');
          link.rel = 'icon'; link.type = 'image/png'; link.href = '/romylabs-favicon.png';
          document.head.appendChild(link);
          var apple = document.createElement('link');
          apple.rel = 'apple-touch-icon'; apple.sizes = '180x180'; apple.href = '/romylabs-favicon.png';
          document.head.appendChild(apple);

          function cleanRomyLabsAdmin(){
            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
            var node;
            while ((node = walker.nextNode())) {
              if (node.nodeValue && node.nodeValue.indexOf('romy@taxrescrm.net') !== -1) {
                node.nodeValue = node.nodeValue.replace(/romy@taxrescrm\.net/g, 'romy@romylabs.com');
              }
            }
            /* Global Command Center must never render a tenant firm's logo. */
            var all = document.querySelectorAll('h1,h2,h3,div');
            for (var i=0; i<all.length; i++) {
              var text = (all[i].textContent || '').trim();
              if (/^Good (morning|afternoon|evening), Romy/.test(text)) {
                var prev = all[i].previousElementSibling;
                if (prev && prev.querySelector && prev.querySelector('img')) prev.remove();
                break;
              }
            }
          }
          window.addEventListener('DOMContentLoaded', function(){
            cleanRomyLabsAdmin();
            new MutationObserver(cleanRomyLabsAdmin).observe(document.body, { childList:true, subtree:true, characterData:true });
          });
        }
      })();
    </script>
    <title>TaxRes CRM</title>

    <link rel="icon" type="image/png" sizes="192x192" href="/taxrescrm-favicon.png" />
