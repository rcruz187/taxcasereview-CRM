# These three are called directly BY SignalWire (not by your logged-in app),
# so they can never carry a Supabase login token. JWT verification must stay
# off for all three or SignalWire's webhooks get rejected before your code
# even runs.
[functions.receive-call]
verify_jwt = false

[functions.call-recorded]
verify_jwt = false

[functions.receive-sms]
verify_jwt = false

[functions.trigger-workflow]
verify_jwt = false
[functions.receive-fax]
verify_jwt = false

# Same deal — these three are the IVR/conference-hold chain, all called
# directly BY SignalWire (auto-attendant digit routing, voicemail prompt
# playback, and the no-answer-redirect-to-voicemail timeout). None of these
# can carry a Supabase login token either.
[functions.ivr-route]
verify_jwt = false

[functions.voicemail-prompt]
verify_jwt = false

[functions.redirect-to-voicemail]
verify_jwt = false

# Public FormaCorp name-check — called from the entity-formation wizard before
# any auth context exists, so JWT verification must be off (like the other
# public-facing endpoints above).
[functions.sunbiz-search]
verify_jwt = false

# ── Public endpoints called WITHOUT a Supabase JWT ──────────────────────────
