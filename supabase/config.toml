# These three are called directly BY SignalWire (not by your logged-in app),
# so they can never carry a Supabase login token. JWT verification must stay
# off for all three or SignalWire's webhooks get rejected before your code
# even runs.
[functions.receive-call]
verify_jwt = false

[functions.call-recorded]
verify_jwt = false

[functions.receive-sms]
verify_jwt = false

[functions.receive-fax]
verify_jwt = false

# Same deal — these three are the IVR/conference-hold chain, all called
# directly BY SignalWire (auto-attendant digit routing, voicemail prompt
# playback, and the no-answer-redirect-to-voicemail timeout). None of these
# can carry a Supabase login token either.
[functions.ivr-route]
verify_jwt = false

[functions.voicemail-prompt]
verify_jwt = false

[functions.redirect-to-voicemail]
verify_jwt = false

# Public FormaCorp name-check — called from the entity-formation wizard before
# any auth context exists, so JWT verification must be off (like the other
# public-facing endpoints above).
[functions.sunbiz-search]
verify_jwt = false

# ── Public endpoints called WITHOUT a Supabase JWT ──────────────────────────
# These are hit directly by external services (SignalWire call webhooks, the
# Stripe payment webhook) or before a session exists (client portal login), so
# they MUST have verify_jwt = false or the caller is rejected. Recorded here in
# the repo so a deploy can never silently reset them again.
[functions.caller-hangup]
verify_jwt = false

[functions.conference-ended]
verify_jwt = false

[functions.hold-music]
verify_jwt = false

[functions.ivr-extension]
verify_jwt = false

[functions.join-conference]
verify_jwt = false

[functions.log-call]
verify_jwt = false

[functions.outbound-call-status]
verify_jwt = false

[functions.outbound-leg]
verify_jwt = false

[functions.voicemail-recorded]
verify_jwt = false

[functions.stripe-checkout-webhook]
verify_jwt = false

[functions.portal-login]
verify_jwt = false

[functions.retention-purge]
verify_jwt = false

[functions.run-autopay-batch]
verify_jwt = false

[functions.gmail-sync-cron]
verify_jwt = false

[functions.quickbooks-oauth-callback]
verify_jwt = false

[functions.xero-oauth-callback]
verify_jwt = false

[functions.quickbooks-sync]
verify_jwt = true

[functions.xero-sync]
verify_jwt = true
[functions.ga4-sync]
verify_jwt = true

[functions.content-generator]
